<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>iframe CSP 测试</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:20px;background:#fafafa;font-family:system-ui,sans-serif}
    h2{font-size:16px;margin:0 0 16px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    iframe{width:100%;height:400px;border:2px solid #333;background:#fff}
    .note{font-size:12px;color:#666;margin:12px 0}
  </style>
</head>
<body>
  <h2>iframe 同域嵌入测试（780×400）</h2>
  <div class="row">
    <div>
      <h2>Q 风格参考页</h2>
      <iframe src="https://ccwq.github.io/infocard-pub/docs/20260604-revfactory-harness-q-style.html"
              loading="lazy" title="Q 风格"></iframe>
    </div>
    <div>
      <h2>黑头风格参考页</h2>
      <iframe src="https://ccwq.github.io/infocard-pub/docs/20260604-xi-an-34-floor-fraud/index.html"
              loading="lazy" title="黑头风格"></iframe>
    </div>
  </div>
  <div class="row">
    <div>
      <h2>绿色风格参考页</h2>
      <iframe src="https://ccwq.github.io/infocard-pub/docs/20260603-hermes-agent-learning-resources/index.html"
              loading="lazy" title="绿色风格"></iframe>
    </div>
    <div>
      <h2>主骨架风格参考页</h2>
      <iframe src="https://ccwq.github.io/infocard-pub/docs/20260530-duix-avatar.html"
              loading="lazy" title="主骨架风格"></iframe>
    </div>
  </div>
  <p class="note">注：如果页面无法加载，说明 GitHub Pages 禁止了 iframe 嵌入。</p>
</body>
</html>
