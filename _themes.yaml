        href: ./theme/handline.html
        note: 新主题的本地预览页
      - title: addyosmani/agent-skills
        href: https://github.com/addyosmani/agent-skills
        note: 这一类插件/自动化/工作流图的风格语义来源之一
    note: 适合"对话 → 插件 → 自动化"与"设计 → 实现 → 验证"的白板式说明卡；不适合极简科技海报或纯数据报表。

