      - "#2D1B00"
      - "#E65100"
      - "#81D4FA"
      - "#1E5CB5"
    preview_url: ./theme/pixelstack.html
    ref_links:
      - title: pixelstack-style preview
        href: ./theme/pixelstack.html
        note: 新主题的本地预览页（金字塔 + 思考者 + 消散箭头三件套）
    note: 适合"方法论层级 / AI 工作流梯度 / 工程演进 / 反直觉金句驱动"类卡片；不适合严肃法律财务合规、纯数据报表、工业冷感或极简科技海报；像素质感 + 现代中文混搭是默认形态，不要改成纯像素字体。

  - slug: scrapbook-style
    css_class: scrapbook
    pill: SCRAPBOOK
    position: 16
