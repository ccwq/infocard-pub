    subtitle: 白紫轻科技工作台 / AI 驱动开发流程
    description: 白底为主、紫色为唯一主强调、轻玻璃科技感与三栏流程骨架。适合 AI 驱动开发、方法论拆解、阶段导航、Agent 工作流与结构化执行页面。
