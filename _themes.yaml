# infocard 主题清单 — 单一事实源
# 增删改查主题时，必须同步更新本文件 + themes.html + fact_store
# 格式说明：
#   slug:          skill 名称，对应 infocard-{slug}-style
#   css_class:     themes.html 里的 CSS class 名（如 q、green、black）
#   pill:          页面右上角标签文字
#   position:      页面内排列顺序（整数越小越靠前）
#   title:         页面标题（与 slug 通常相同）
#   subtitle:      副标题 / 简短定位
#   description:   描述文字，出现在卡片首行
#   keywords:      芯片标签
#   swatch:        5 个色块的 hex 色值
#   preview_url:   iframe 预览 URL，指向该主题已发布的参考页面
#   ref_links:     参考页面列表 [{title, href, note}]
#   note:          底部注释，适合什么 / 不适合什么

themes:
  - slug: q-style
    css_class: q
    pill: Q
    position: 1
    title: infocard-q-style
    subtitle: Q 版主题 / 纸感卡片风
    description: 暖米纸背景、厚黑边框、圆角卡片、彩色 accent 与贴纸式标签。适合框架对比、方法论总览、轻编辑风知识卡，不适合严肃调查风。
    keywords:
      - 纸感
      - 手作
      - 并列对比
    swatch:
      - "#f8efd9"
      - "#9bdc77"
      - "#7cc8ff"
      - "#ffc45c"
      - "#1d1b16"
    preview_url: ./theme/q.html
    ref_links:
      - title: revfactory/harness Q 风参考
        href: ./docs/20260604-revfactory-harness-q-style.html
        note: Q 版主题的开源技术卡落地页
      - title: Q 风 Agent Framework Map
        href: ./docs/20260603-q-style-agent-framework-map.html
        note: 适合看板式、对比式、总览式页面
    note: 适合“多选项并列 + 轻编辑 + 贴纸式层级”。不要拿它去承载严肃调查卡或黑头结论页。

  - slug: green-style
    css_class: green
    pill: GREEN
    position: 2
    title: infocard-green-style
    subtitle: 绿色主题 / 冷静编辑风
    description: 青绿 / 翡翠 / teal 系强调，保留技术信息卡的秩序感与可读性。适合需要克制、清爽、专业感的知识卡、工具卡、方法卡。
    keywords:
      - 青绿
      - teal
      - 编辑风
    swatch:
      - "#ffffff"
      - "#0d9488"
      - "#15803d"
      - "#dcfce7"
      - "#111111"
    preview_url: ./theme/green.html
    ref_links:
      - title: Hermes Agent Learning Resources
        href: ./docs/20260603-hermes-agent-learning-resources/index.html
        note: 绿色信息卡片的稳定落地范例
    note: 适合“克制、专业、冷静”的阅读型卡片；不适合需要高压结论感的黑头调查风。

  - slug: black-head-style
    css_class: black
    pill: BLACK HEAD
    position: 3
    title: infocard-black-head-style
    subtitle: 黑头主题 / 调查拆解风
    description: 黑色页眉是视觉锚点，白纸正文承载大块说明，红色负责结论与风险，蓝绿仅作辅助。适合调查、论证、workflow 拆解与“先结论再展开”的结构。
    keywords:
      - 黑头
      - 结论先行
      - 调查拆解
    swatch:
      - "#070707"
      - "#ffffff"
      - "#c8102e"
      - "#1b4fff"
      - "#0f8a4b"
    preview_url: ./theme/black.html
    ref_links:
      - title: Claude Code Dynamic Workflows
        href: ./docs/20260603-claude-code-dynamic-workflows.html
        note: 黑头 + 结论先行 + 模块拆解
      - title: 西安加贝花园购房纠纷调查
        href: ./docs/20260604-xi-an-34-floor-fraud/index.html
        note: 调查页、时间线、责任链拆解
    note: 严肃调查与拆解风的首选；不要误用成 Q 风，也不要做成大面积红底海报。

  - slug: main-style
    css_class: main
    pill: MAIN
    position: 4
    title: infocard-main-style
    subtitle: 主要主题 / 默认主骨架 / 小字
    description: 红黑白主骨架，蓝黄绿辅助状态色，stats / grid / pill / flow / section 齐全。它代表 infocard 的默认主主题：高密度、模块化、说明书感强，但小字必须可读，不能照搬过小字号。
    keywords:
      - 默认主骨架
      - 蓝辅助
      - 小字可读
    swatch:
      - "#c8102e"
      - "#0a0a0a"
      - "#f5f2ec"
      - "#0036a3"
      - "#e8c200"
    preview_url: ./theme/main.html
    ref_links:
      - title: Duix Avatar
        href: ./docs/20260530-duix-avatar.html
        note: 主骨架、stats、grid、flow 的稳定参考
      - title: Claude Sub-Agents
        href: ./docs/20260529-claude-subagents.html
        note: 参考骨架，不参考其原始过小字号
    note: 适合作为后续大多数工具说明 / Agent 实施手册的默认底盘。

  - slug: blue-technical-manual-style
    css_class: blue
    pill: BLUE MANUAL
    position: 5
    title: infocard-blue-technical-manual-style
    subtitle: 蓝色技术手册主题
    description: 黑头标题、红蓝双强调、暖白纸底。红色负责结论与警示，蓝色负责流程与分层，适合 Claude Code / Skill / Agent / workflow 的技术手册、能力矩阵与执行顺序页面。
    keywords:
      - 黑头
      - 蓝流程
      - 红判断
    swatch:
      - "#111111"
      - "#d80018"
      - "#1f63ff"
      - "#fffdf8"
      - "#f6f4ef"
    preview_url: ./theme/blue.html
    ref_links:
      - title: Claude Code Web Skill Stack
        href: ./docs/20260603-claude-code-web-skill-stack-swiss-blue.html
        note: 红蓝双强调的技能分层案例
    note: 适合“技术手册 + 执行顺序 + 分层解释”；不适合贴纸感 Q 风。

  - slug: darkblue-style
    css_class: darkblue
    pill: DARKBLUE
    position: 6
    title: infocard-darkblue-style
    subtitle: 深蓝渐变 / Agent workbench
    description: 深蓝黑底、渐变光晕、玻璃面板和图标化模块，适合 Agent IDE、桌面工作台、并行任务、终端、编辑器与 Git 状态卡。视觉语言来自产品宣传页而不是纸感文档页。
    keywords:
      - 深蓝渐变
      - 玻璃面板
      - 图标化工作台
    swatch:
      - "#0c1020"
      - "#171c2b"
      - "#58c3ff"
      - "#2db36a"
      - "#8459ff"
    preview_url: ./theme/darkblue.html
    ref_links:
      - title: Nezha · Agent-First IDE for Vibe Coding
        href: ./docs/20260611-nezha.html
        note: 这套深蓝工作台主题的成品参考页
    note: 适合“Agent-first IDE / 深夜产品页 / 并行任务工作台”；不适合暖纸、黑头、瑞士编辑风或 Q 风。

  - slug: hardblue-style
    css_class: hardblue
    pill: HARDBLUE
    position: 7
    title: infocard-hardblue-style
    subtitle: 硬核蓝手册 / 网格底纹 + 编号块 + 多版式
    description: 黑头 hero + 暖白纸底 + 红蓝双强调 + 网格底纹与色斑光斑。顶部 hero-bar 三色拼接（左红 / 中黑 / 右蓝），章节用 96px 大数字编号块，搭配 grid-2/3/4、matrix、risk（含 data-accent 顶部色带）等多套版式。比 blue-technical-manual-style 更"硬核手册"：更厚边框、更多 grid 变体、更多色块锚点。
    keywords:
      - 硬核手册
      - 编号块
      - 网格底纹
      - 多 grid
    swatch:
      - "#111111"
      - "#d80018"
      - "#1f63ff"
      - "#fffdf8"
      - "#f6f4ef"
    preview_url: ./theme/hardblue.html
    ref_links:
      - title: 余承东像丁春秋吗？像的是话术，不是内功
        href: ./docs/20260606-yu-chengdong-dingchunqiu.html
        note: 硬核蓝手册的代表落地卡：hero-bar、编号块、grid-3、matrix、risk 顶部色带齐全
    note: 适合"重型多章节技术 / 调查 / 观点拆解手册"；不适合 Q 风、纸感、轻量卡片。版面比 blue-technical-manual-style 更"密、硬、多 grid"。

  - slug: redswiss-style
    css_class: redswiss
    pill: REDSWISS
    position: 7
    title: infocard-redswiss-style
    subtitle: 红黑瑞士编辑风 / 红黑高密度 / 无蓝黄绿辅助
    description: 红黑高密度瑞士编辑风，无蓝黄绿辅助色，无 hero-bar，section 编号+红色强调，纯 grid-dominant dense layout。适合重型技术手册、数据密集说明、Agent 工具卡。与 main-style 的区别：去掉蓝黄绿辅助状态色，更"纯粹"的红黑瑞士编辑感。
    keywords:
      - 瑞士编辑风
      - 红黑高密度
      - 无辅助色
      - grid-dominant
    swatch:
      - "#0a0a0a"
      - "#c8102e"
      - "#f5f2ec"
      - "#fffdf9"
      - "#0a0a0a"
    preview_url: ./theme/redswiss.html
    ref_links:
      - title: 主骨架主题（main-style）
        href: ./theme/main.html
        note: redswiss 与 main 共享红黑骨架；redswiss 去掉蓝/黄/绿辅助色，更"纯粹"瑞士编辑风
    note: 适合"重型技术手册 + 数据密集说明 + Agent 工具卡"；不适合需要蓝/黄/绿辅助色的状态色场景。


  - slug: color-material-style
    css_class: color-material
    pill: COLOR MATERIAL
    position: 8
    title: infocard-color-material-style
    subtitle: Color Material 风 / 材料面板式架构海报
    description: 暖米纸背景、深色中央控制台、左右分栏、彩色能力节点、底部生命周期、右侧深色信息 rail。适合技术产品、能力地图、调查复盘、架构说明、证据矩阵等需要“中心对象 + 分区节点 + 信息 rail”的高密度内容。
    keywords:
      - Color Material
      - 材料面板
      - 中央控制台
      - 信息 rail
    swatch:
      - "#f7f2e8"
      - "#111111"
      - "#6e3fd6"
      - "#2e9b4b"
      - "#2e6be6"
    preview_url: ./theme/color-material.html
    ref_links:
      - title: Color Material
        href: ./docs/20260608-color-material.html
        note: Color Material 风的技术产品 / 材料面板架构样例
    note: 适合“中心对象 + 能力/证据/风险彩色节点 + 右侧信息 rail”的架构海报；不适合 Q 风、纸感、黑头调查卡。

  - slug: wood-style
    css_class: wood
    pill: WOOD
    position: 9
    title: infocard-wood-style
    subtitle: 木感编辑风 / Agentic Engineering Patterns
    description: 暖米纸底、深黑标题、蓝色链接、棕色金句块、黑色流程条与三栏模块化。适合 Simon Willison 式 agentic engineering、技术手册、方法论拆解与高密度编辑型知识卡。
    keywords:
      - 木感
      - 暖纸
      - Agentic Engineering
      - 编辑风
    swatch:
      - "#f3eee7"
      - "#101010"
      - "#2f5fb8"
      - "#8a5a3c"
      - "#fffdf8"
    preview_url: ./theme/wood.html
    ref_links:
      - title: Agentic Engineering Patterns
        href: https://simonwillison.net/guides/agentic-engineering-patterns/
        note: 这套主题的视觉源头与方法论来源
      - title: wood-style preview
        href: ./theme/wood.html
        note: 新主题的本地预览页
    note: 适合“结论先行 + 流程闭环 + 三栏方法论”页面；不适合重木纹、贴纸感或高饱和海报风。

  - slug: handline-style
    css_class: handline
    pill: HANDLINE
    position: 10
    title: infocard-handline-style
    subtitle: 手绘草图风 / Whiteboard Workflow
    description: 米纸底、黑笔粗线、橙色强调、手绘流程图与 sticky note。适合插件系统、技能创建、自动化流程、对话式调度、移动开发三段式与工具链说明。
    keywords:
