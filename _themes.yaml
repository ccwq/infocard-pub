  - slug: bigwhite-style
    css_class: bigwhite
    pill: BIGWHITE
    position: 12
    title: infocard-bigwhite-style
    subtitle: 通用大白商务风 / 白底报告页
    description: 纯白背景、大留白、深蓝单强调、黑色标题、细灰分割线与大数字英雄化。适合技术报告、产品发布、商业分析、数据简报和项目复盘；用留白和对齐建立秩序，不靠厚边框、复杂纹理或重阴影。
