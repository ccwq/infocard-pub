title: mcp-for-blender：让 AI 客户端直接驱动 Blender
desc: ahujasid/mcp-for-blender 由 Blender 插件与 Python MCP server 两部分组成，让 Claude Code、Cursor、Codex 等客户端用自然语言操作 Blender 场景、材质与建模，也能让 AI 直接写并执行 Blender Python。一条 curl 命令即自动探测本机客户端、装插件；Poly Haven 约 2400 个 CC0 资产无需 API key。含第三方非官方、只跑一个 server 实例、需 Blender 3.0+ 与 Python 3.10+、仓库已由 blender-mcp 改名等限制。快照 2026-10-14，30,696 star，MIT。
