desc: emulate.dev 是本地 API 模拟器：为 GitHub、Stripe 等第三方服务提供本地、确定性、无依赖的模拟，支持 CLI、程序化 API、Next.js 适配器。适合 CI、沙盒与 Agent Loop，把外部 API 变成本地可控状态。
note: 强调本地、有状态、协议尽量真实、可重置、适合 CI 与沙盒，能把第三方 API 依赖压成本地状态层。
