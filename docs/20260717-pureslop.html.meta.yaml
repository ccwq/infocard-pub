title: alonsarias/pureslop · PURESLOP.md 反面教材实验
desc: PURESLOP.md 是 alonsarias/pureslop 项目的核心文件，一份供 AI 编码代理读取的 Markdown 指令，故意放大典型 AI 生成代码模式使其可见可识别。项目是讽刺/教育项目，不是检测器、自动修复器或生产规范。包含 10 条反面规则（冗余注释、深层嵌套、any 类型逃逸、吞异常等）、4 条总原则、before/after 对照示例、npx pureslop CLI、MIT 许可证（v1.0.4，2026-04-05）。
