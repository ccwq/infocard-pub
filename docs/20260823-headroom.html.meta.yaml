title: "Headroom：本地优先上下文压缩层 · 60–95% fewer tokens for JSON · 15–20% for coding agents"
desc: "Headroom (headroomlabs-ai/headroom, Apache-2.0, 67k★) 是本地优先的上下文压缩层，压缩 tool outputs、logs、RAG chunks、files 和对话历史后再送入 LLM。提供 library/proxy/agent wrap/MCP server 四种入口，支持 Claude/Codex/Grok/Cursor/Aider/OpenCode/Cline/OpenClaw 等主流 coding agent。官方 benchmark：JSON 60–95%、coding agents 15–20% fewer tokens；真实工作负载最高 92%。"
