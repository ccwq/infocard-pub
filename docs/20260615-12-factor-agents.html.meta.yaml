title: 12-Factor Agents：把 LLM 应用做成可交付软件
desc: Humanlayer 的 12-Factor Agents 用 12 条原则重写 LLM 应用边界：prompt、context、structured tools、execution state、human gate、control flow、error compaction、small agents 与 stateless reducer，目标不是堆 prompt，而是把 agent 做成可交付生产客户的软件。
