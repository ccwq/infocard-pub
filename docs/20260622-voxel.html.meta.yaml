desc: 体素（Voxel = Volume Pixel）是三维空间分割的最小数据单元。这张科学普及卡用像素堆叠风格，从定义、词源、与像素/多边形的对比、渲染方法（Marching Cubes / 直接体渲染 / 增量误差光栅化）、医学影像、游戏里程碑（Minecraft / Outcast / Comanche / No Man's Sky / Teardown）到 toxel 和 hypervoxel 的扩展概念，完整呈现体素是什么、为什么重要、用在哪里。
note: 面向科普读者的体素入门卡：含维基百科体素立方体图像说明、像素-体素-多边形三栏对比表、三大渲染方法的分层卡片、9 款里程碑游戏时间线，以及体素≠方块、体素数据量大但可压缩等关键认知。
