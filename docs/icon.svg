<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>infocard-pub Logo</title>
  <desc>叠加卡片图标 · 红黑瑞士风</desc>

  <!-- 底板 深灰 -->
  <rect x="38" y="58" width="144" height="96" rx="6" fill="#111" opacity="0.85"/>
  <!-- 底板 白线 -->
  <rect x="38" y="58" width="144" height="96" rx="6" fill="none" stroke="#111" stroke-width="4"/>

  <!-- 中层 深红 -->
  <rect x="56" y="74" width="144" height="96" rx="6" fill="#E60012" opacity="0.92"/>
  <!-- 中层 黑色描边 -->
  <rect x="56" y="74" width="144" height="96" rx="6" fill="none" stroke="#111" stroke-width="4"/>

  <!-- 顶层 白色主卡片 -->
  <rect x="68" y="88" width="144" height="96" rx="6" fill="#ffffff"/>
  <!-- 顶层 黑边 -->
  <rect x="68" y="88" width="144" height="96" rx="6" fill="none" stroke="#111" stroke-width="4"/>

  <!-- 顶层内容：红条 + 信息行 -->
  <rect x="80" y="100" width="10" height="72" rx="2" fill="#E60012"/>

  <!-- 信息行模拟 -->
  <rect x="98" y="106" width="84" height="8" rx="2" fill="#111" opacity="0.85"/>
  <rect x="98" y="122" width="60" height="6" rx="2" fill="#bbb"/>
  <rect x="98" y="134" width="72" height="6" rx="2" fill="#bbb"/>
  <rect x="98" y="146" width="48" height="6" rx="2" fill="#bbb"/>
  <rect x="98" y="158" width="56" height="6" rx="2" fill="#bbb"/>
</svg>