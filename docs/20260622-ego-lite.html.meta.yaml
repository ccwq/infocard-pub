desc: "citrolabs/ego-lite (146⭐, MIT, TypeScript, macOS) 是第一款为人和 AI Agent 并行使用而设计的浏览器：每个 Agent 拥有独立 Space，多任务并行不冲突，代码式（非 CLI）调用让复杂工作流比 Vercel agent-browser 快最多 2.5×，token 消耗显著更少。继承 Chrome 数据，无需重新登录；ego-browser skill 让任何 Agent CLI（Claude Code / Codex / Cursor）都能驱动。"
note: "Agent-First 浏览器：六大核心特性 + 与 Browser-Use / agent-browser / ChatGPT Atlas / Perplexity Comet 的能力矩阵对比 + 三种安装方式 + Benchmark 数据。Windows / Linux 在路线图上。"
