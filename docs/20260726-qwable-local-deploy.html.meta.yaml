desc: Qwable-v1：35B MoE 稀疏模型（3B 激活），融合 Claude Opus 4.7 推理与 Fable-5 工具行为蒸馏。本卡覆盖：模型身份与许可证、量化与显存矩阵、Windows（LM Studio / llama.cpp）与 Linux（llama-server / Ollama / vLLM）完整部署流程、社区体验、吞吐数据（条件化）、与 Qwen3.6-35B-A3B / Qwen3.6-27B 横向对比，以及证据等级与待核验项。
