title: LLM Wiki：Karpathy 的知识编译革命
desc: Karpathy 2026年4月发布的 llm-wiki 方法论：以三层架构（Raw/Wiki/Schema）、三个操作（Ingest/Query/Lint）替代传统 RAG，让 LLM 持续维护一个持久累积的复合知识工件。明确不用 RAG 的根本原因：RAG 每次从零发现知识，无积累；llm-wiki 编译一次，持续保持最新。⚠️ 存疑项已在正文标注。
