title: 微软 LiteBox：Rust 写的安全沙箱库操作系统
desc: 微软 LiteBox 是 Rust 编写的开源库操作系统（Library OS），通过削减应用程序与宿主之间的接口大幅减小攻击面，支持 kernel-mode 与 user-mode 两种沙箱执行模式，提供 North Shim ×
  South Platform 两层可插拔架构，可运行于 Windows、Linux、SEV SNP、OP-TEE、LVBS 等多种平台。2024-12-11 建仓，2026-10-09 快照 2,862★。
