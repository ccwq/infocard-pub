desc: 微软开源的 AI Agents for Beginners 是一套面向入门者的智能体课程，当前 README 列出 14 讲，覆盖框架、设计模式、工具调用、RAG、可信智能体、规划、多智能体、协议、上下文工程、记忆管理与生产部署，并提供多语言翻译和可运行代码示例。
note: 课程名原为 12 Lessons，但 README 当前目录已扩展到 14 讲。
