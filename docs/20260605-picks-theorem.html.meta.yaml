desc: Pick 定理中文讲义（Q 风格）：1899 年 Georg Pick 提出，用「内部格点 i + 边界格点 b/2 - 1」就能算任意简单多边形面积。本卡面向初中生讲解，含公式、3 个手算例子、4 种证明思路、SVG 示意图、推广与限制。
