title: 五个 Hermes 社区项目：装哪个、先查什么
desc: "@GitTrend0x 2026-11-10 推文点名的五个 Hermes 社区项目逐项拆解——SpendSense 用量账单插件（GPL-3.0，Early access，只记记账元数据不上传，validate 通过再用）、hermes-fleet-apps 七角色开发舰队模板（MIT，两道人工审批门，仅 Windows+Python 实测）、hermes-genui 桌面端生成式 UI 插件（MIT，装前先关 tool search，模型只发数据不发代码）、Nous-Girl 桌面机器人固件（Beta，Hermes 提供长期记忆，仅维护者硬件验证过）与 Alado 手机 PWA 客户端（MIT，手机端不存秘密，凭据只走 Hermes vault）；每项整理 README 写明的用途、安装命令与前提、权限与数据边界、验证方法，附五项对照表与『对门槛、留退路、单装验证、再给权限』的行动顺序；全部保留仓库链接，口径为文档整理未安装实测。"
