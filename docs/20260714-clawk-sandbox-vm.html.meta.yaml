title: "Clawk — AI Coding Agent 沙箱 VM"
desc: "Clawk 为 Claude Code、Codex 等 AI Coding Agent 提供独立可销毁的 Linux VM，每次任务运行在全新隔离环境，宿主机文件、密钥、系统环境完全隔离。默认 deny-all 网络策略，Go 单二进制，Apache-2.0 开源。macOS 用 Apple Virtualization，Linux 用 Firecracker。"
