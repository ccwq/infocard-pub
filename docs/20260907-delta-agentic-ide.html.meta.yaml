title: Delta：Zed 创始人新作 Agentic 协作 IDE
desc: Delta 由 Zed 创始人 Nathan Sobo 创立，通过 DeltaDB 将对话与代码工作树合二为一，实现跨会话持久化的 Agent 状态、Thread 锚定追踪、多人实时协作与 Jump to Prompt 导航。官网真实案例展示 SumTree 优化 12× 提速（41.2µs→3.4µs）。扩写版：progressive-doc 初学者向，完整对比表、五大机制拆解、三日上手路线、DeltaDB 技术分析、术语表。
