title: Agent 记忆系统选型指南：12 种系统的系统对比
desc: 上海交大 × 清华 × MemTensor 系统评测了 12 种 Agent 记忆系统，把记忆拆成 4 个模块（表示与存储、提取、检索与路由、维护）独立评测。核心结论：没有万能架构，记忆结构与 workload 瓶颈的匹配程度决定效果；局部维护优于全局重建；简单问答用向量检索，多跳推理用知识图谱。
