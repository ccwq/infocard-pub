title: "agentes.chat：人和 AI 代理同频道的开源自托管 Slack 替代品"
desc: "2026-11-09 才公开的 agentes.chat 把代理做成频道里的一等成员：带角色、指令、模型和月度预算，敏感动作等人审批。本卡逐项核对 README、SELF_HOSTING.md、安装脚本、docker-compose、NOTICE 与 ADR 0012，确认预算在每次调用前做预留校验、密钥加密存储、pgvector 以 digest 固定；并给出先审查安装脚本再执行、Tailscale 私网 HTTPS 十分钟部署、建频道建代理、一条无副作用验证任务的完整读者路径。所有部署与 UI 步骤为官方文档转述、未经实机验证，产品声称与核对状态全程分开标注。"
