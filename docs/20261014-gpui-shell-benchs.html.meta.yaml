title: gpui-shell-benchs：只给 AI 一张设计图，能做出多完整的原生应用
desc: huacnlee/gpui-shell-benchs 收录 5 个由 AI agent 从零写出的 gpui-shell 原生应用（Gmail 客户端、投标看板、船队追踪、PDF 签名器、skills 管理器），并逐项记录 agent 与模型、wall/active 时间、prompts 与 token 总量。含 cargo 安装与 gpui-shell types/check/dev 命令、token 里绝大部分是 cache read 的口径、12 项运行时问题与绕法，以及「不得商用」的许可边界。代码 MIT，快照 2026-10-14。
