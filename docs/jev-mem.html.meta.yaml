title: Jev-Mem：System-One Controlled Agentic Memory — 记忆决策与推理分离
desc: Jev-Mem 把记忆管理的快速决策（System One）与深度推理（System Two）分离：轻量级控制器组织记忆、路由查询、分配预算，昂贵 LLM 只在最后一步登场。LoCoMo 测试：综合得分 0.777，比 MAGMA 高 11.0%，记忆构建快 6.6 倍，查询延迟降低 36.7%。
