title: Claudian：把 AI 编程 Agent 嵌进 Obsidian 侧边栏
desc: Claudian 是 Obsidian 插件，将 Claude Code / Codex / OpenCode / Pi 嵌入 vault 侧边栏，让笔记库成为 Agent 的工作目录，支持文件读写、搜索、bash 与多步工作流，无需切换窗口。热度数据（632 commits，2026 年中旬快照）。社区中文博客多篇评测。
