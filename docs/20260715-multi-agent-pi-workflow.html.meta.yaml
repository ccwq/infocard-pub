title: 多 Agent vs 单 Agent 实战总结 — Pi 社区方法论 + pi-workflow
desc: Pi 社区 r/PiCodingAgent 用户实战结论：单 agent 适合简单/密集上下文任务，多 agent 适合可拆分大任务（但要承担上下文转移、重复工作、事实验证、编排四个成本）。附 pi-workflow JSON 工作流规范工具，声明式描述何时分拆、怎么分配、在哪验证、怎么拼回。189 Stars，MIT。
