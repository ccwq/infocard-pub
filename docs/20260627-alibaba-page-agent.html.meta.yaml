title: 阿里 Page-Agent：一行 JS 让网页直接支持自然语言操控
desc: 阿里巴巴开源的纯前端 GUI Agent 库（9.6k Stars，v1.5.1）。通过 DOM 文本化而非截图的方式，让大模型操控网页元素。npm 一行 import，零后端，支持 GPT-4/Claude/Gemini/Ollama，适用于 SaaS 后台、ERP、CRM 等表单密集场景。
