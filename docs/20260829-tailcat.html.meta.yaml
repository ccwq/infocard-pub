title: "Tailcat：不需要账号、Root 或端口的端到端加密临时组网工具"
desc: "Tailcat 是一个用户态加密临时组网 CLI：像 netcat 一样工作在 Tailscale 数据平面上，通过连接 token 建立 WireGuard 隧道，支持端口转发、文件收发、SSH、SOCKS5 与连通性探测。当前 v0.3.0（2026-08-30）含节点/发现密钥分离安全修复。"
