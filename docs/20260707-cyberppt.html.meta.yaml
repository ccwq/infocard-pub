title: CyberPPT：咨询风格 PPT 生成 Codex Skill
desc: CyberPPT 把文档、研报和业务数据直接转成咨询风格的高密度 PPT。先从 DOCX、PDF、Excel 里提取事实和数字理成证据表，再比较故事线，定下每一页讲什么。内置 8 种咨询风格配色版式，逐页生成，主标题、正文、关键数字均可编辑。生成后有文字溢出、数字出处、页面密度等多重检查关卡。
