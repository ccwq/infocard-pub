title: 动手学 Pi：15 个 Checkpoint 从零构建 Pi-style Coding Agent
desc: 沿 15 个可运行 checkpoint，从一条离线 Agent 轨迹出发，亲手实现完整 Pi-style coding agent。涵盖 TypeScript 协议、流式模型、Provider、工具循环、Agent Loop、会话树、Context Compaction、资源扩展与独立评测。每章四件套：教材正文 + 真实 commit + 聚焦测试 + 故障实验。课程代码为可 checkout、运行和验证的 Git 历史。
