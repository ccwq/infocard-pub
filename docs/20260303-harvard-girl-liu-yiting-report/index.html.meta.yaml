desc: 1999年成都女孩刘亦婷被哈佛录取，其父母出版《哈佛女孩刘亦婷》销量超260万册，影响两代家庭教育。25年后当事人留美未归、职场平庸，舆论从狂热转为"神话破灭"。本报告还原两书内容、录取真相（推荐信是决定性因素，书对此只字不提）、方法异化、社会影响与深层结构，并关联"协和4+4"董袭莹事件的历史对照。
