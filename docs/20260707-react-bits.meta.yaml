title: react-bits：高级动效与交互特效 React 组件库
desc: 专为死磕视觉冲击和交互细节的偏执狂准备的高级动效组件库。像素级动画、流体文字特效、动态背景粒子、3D翻转卡片、鼠标交互特效，基于 React + Tailwind + Framer Motion 纯代码构建，轻量、深度可定制，自带实时参数调节面板。
