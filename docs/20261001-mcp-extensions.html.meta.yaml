title: MCP Extensions — OpenAI 把你的产品直接嵌进 ChatGPT
desc: OpenAI 开源（498★ · Apache-2.0）：给 MCP 加 ChatGPT 专属能力——Global/Thread/File 三类入口、文件自定义 Viewer + 资源读写订阅、原生 Structured Settings、表单缩略图选择器、Composer @mentions、Deep Links、Onboarding skill。TS/Python 双 SDK 三行接入；推文「Skill/MCP/App/Extensions 四层论」经 50KB spec 逐条印证，含平台支持表与安全模型（宿主永不给裸路径）。快照 2026-10-01。
