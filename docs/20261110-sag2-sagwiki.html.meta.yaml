desc: "Zleap AI 开源 SAG2 检索架构（arXiv:2610.22588）与桌面端 SAG Wiki：SQLite+BM25+JEV 取代 Embedding 与大模型预处理，11,656 段建库 2.36 秒（一代 4.57 小时/2826 万 tokens），三测试集 R@5/R@10 全部最高，企业基准 51.2 万文档 R@10 81.10%。含上手步骤、CLI/Agent 接入与隐私边界：语义检索与问答会把片段发给云端模型服务。作者实测与第一方数据已分级标注。"
