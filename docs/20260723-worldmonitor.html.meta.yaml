desc: WorldMonitor 信息卡。开源版 Palantir，AI 驱动实时全球情报仪表板。整合 65+ 数据源、29 个交易所，Globe.gl / Deck.gl WebGL 可视化，Tauri 2 + Rust 跨平台桌面，支持本地部署与 Groq/OpenRouter 云端扩展。适合地缘政治监控、金融交易、网络基础设施与量化系统集成。赋能个人与小团队获取 Palantir 级别情报能力。
