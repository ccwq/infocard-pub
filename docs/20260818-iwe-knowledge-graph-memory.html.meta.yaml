desc: iwe 是用 Rust 把任意 Markdown 目录解析成可查询知识图谱的开源工具，同时暴露 CLI 与 MCP server 两套入口：人用 iwe init / schema validate / find，agent 用 search / retrieve / create / refactor 四个 MCP 工具。本卡拆解 v0.19.1 的能力、编辑器集成、性能基准与 5 步上手。
