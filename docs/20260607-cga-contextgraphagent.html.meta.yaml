title: CGA：把仓库图谱变成 AI 编码的局部证据层
desc: CGA（ContextGraphAgent）是一个 local-first graph context service，把仓库文件、符号、调用、导入和轻量数据流索引进 FalkorDB，再通过 MCP 工具、Admin Dashboard 与 3D Graph Viewer 给 AI 编码代理提供局部证据。
