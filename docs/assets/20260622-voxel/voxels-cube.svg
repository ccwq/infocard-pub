<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="体素立方体示意图：由若干小立方体组成的三维网格">
  <title>体素立方体示意图</title>
  <desc>展示由若干小立方体（体素）堆叠而成的三维网格，每个体素是三维空间的最小数据单元，整体形成一个可见的立体结构。</desc>
  <style>
    .face-top{fill:#FFB066;stroke:#2D1B00;stroke-width:1.6;stroke-linejoin:miter}
    .face-left{fill:#1E5CB5;stroke:#2D1B00;stroke-width:1.6;stroke-linejoin:miter}
    .face-right{fill:#81D4FA;stroke:#2D1B00;stroke-width:1.6;stroke-linejoin:miter}
    .face-top-alt{fill:#E65100;stroke:#2D1B00;stroke-width:1.6;stroke-linejoin:miter}
    .face-left-alt{fill:#173f7a;stroke:#2D1B00;stroke-width:1.6;stroke-linejoin:miter}
    .face-right-alt{fill:#5fb6d8;stroke:#2D1B00;stroke-width:1.6;stroke-linejoin:miter}
    .grid{fill:none;stroke:#2D1B00;stroke-width:1;stroke-opacity:.35}
    .label{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#2D1B00;font-weight:700;letter-spacing:.04em}
    .axis{stroke:#2D1B00;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .axis-label{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:900;fill:#E65100}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2D1B00"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="#FFF1D7"/>

  <!-- grid pattern -->
  <g class="grid">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
  </g>

  <!-- 3D voxel grid: isometric projection
       Cell size: 40 px wide. dx=34, dy=20 for iso.
       Drawing from back to front, bottom to top -->
  <!-- We'll draw a 4x4x4 voxel grid with isometric tiles.
       Each voxel: top face (rhombus), left face, right face -->

  <g transform="translate(200,330)">
    <!-- Macro: each voxel at grid coord (i,j,k) i=x j=y(depth) k=z(height)
         iso transform: x = (i - j) * 34, y = (i + j) * 18 - k * 36 -->

    <!-- Layer k=0 (bottom) — only edge tiles visible, but we'll draw a 4x4 base in faint tone -->

    <!-- For clarity draw a 4x4 base of dark blue cells at k=0, drawing back to front -->

    <!-- We'll just draw a compact 3x3x3 staircase to illustrate voxels -->

    <!-- A staircase-shape voxel cluster -->
    <!-- Define voxel as group at translated position -->

    <!-- back row -->
    <!-- voxel (0,2,0) -->
    <g transform="translate(-136,36)">
      <polygon class="face-left" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top" points="0,0 34,-18 68,0 34,18"/>
    </g>
    <g transform="translate(-68,36)">
      <polygon class="face-left" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top" points="0,0 34,-18 68,0 34,18"/>
    </g>
    <g transform="translate(0,36)">
      <polygon class="face-left" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top" points="0,0 34,-18 68,0 34,18"/>
    </g>

    <!-- middle row (y=1) -->
    <g transform="translate(-102,72)">
      <polygon class="face-left" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top" points="0,0 34,-18 68,0 34,18"/>
    </g>
    <g transform="translate(-34,72)">
      <polygon class="face-left" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top" points="0,0 34,-18 68,0 34,18"/>
    </g>
    <g transform="translate(34,72)">
      <polygon class="face-left" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top" points="0,0 34,-18 68,0 34,18"/>
    </g>

    <!-- front row (y=2) -->
    <g transform="translate(-68,108)">
      <polygon class="face-left" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top" points="0,0 34,-18 68,0 34,18"/>
    </g>
    <g transform="translate(0,108)">
      <polygon class="face-left" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top" points="0,0 34,-18 68,0 34,18"/>
    </g>
    <g transform="translate(68,108)">
      <polygon class="face-left" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top" points="0,0 34,-18 68,0 34,18"/>
    </g>

    <!-- 2nd layer (k=1) — partial stack -->
    <g transform="translate(-68,0)">
      <polygon class="face-left-alt" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right-alt" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top-alt" points="0,0 34,-18 68,0 34,18"/>
    </g>
    <g transform="translate(0,0)">
      <polygon class="face-left-alt" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right-alt" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top-alt" points="0,0 34,-18 68,0 34,18"/>
    </g>
    <g transform="translate(-34,36)">
      <polygon class="face-left-alt" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right-alt" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top-alt" points="0,0 34,-18 68,0 34,18"/>
    </g>
    <g transform="translate(34,36)">
      <polygon class="face-left-alt" points="0,0 34,-18 34,22 0,40"/>
      <polygon class="face-right-alt" points="34,-18 68,0 68,40 34,22"/>
      <polygon class="face-top-alt" points="0,0 34,-18 68,0 34,18"/>
    </g>

    <!-- top layer (k=2) — highlight voxel -->
    <g transform="translate(0,-36)">
      <polygon class="face-left" points="0,0 34,-18 34,22 0,40" fill="#fff" stroke="#E65100" stroke-width="2.4"/>
      <polygon class="face-right" points="34,-18 68,0 68,40 34,22" fill="#FFE9C9" stroke="#E65100" stroke-width="2.4"/>
      <polygon class="face-top" points="0,0 34,-18 68,0 34,18" fill="#E65100" stroke="#E65100" stroke-width="2.4"/>
    </g>
  </g>

  <!-- axis arrows -->
  <g transform="translate(40,360)">
    <line class="axis" x1="0" y1="0" x2="40" y2="20"/>
    <text class="axis-label" x="44" y="24">x</text>
    <line class="axis" x1="0" y1="0" x2="-30" y2="18"/>
    <text class="axis-label" x="-46" y="22">y</text>
    <line class="axis" x1="0" y1="0" x2="0" y2="-40"/>
    <text class="axis-label" x="6" y="-44">z</text>
  </g>

  <!-- callout label for highlight voxel -->
  <g transform="translate(248,82)">
    <line x1="-40" y1="22" x2="-10" y2="40" stroke="#2D1B00" stroke-width="1.5"/>
    <rect x="-2" y="0" width="148" height="42" fill="#fff" stroke="#2D1B00" stroke-width="2"/>
    <text class="label" x="6" y="16">1 voxel (体素)</text>
    <text class="label" x="6" y="32" style="font-size:9.5px;font-weight:600">三维网格的最小单元</text>
  </g>
</svg>
