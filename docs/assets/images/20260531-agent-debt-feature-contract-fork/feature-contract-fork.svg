<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Feature contract vs model-specific fork diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#e60012"/>
    </marker>
    <style>
      .t1{font:900 38px Inter,Arial,sans-serif; fill:#fff; letter-spacing:-.03em}
      .t2{font:700 18px Inter,Arial,sans-serif; fill:#ffd7dc}
      .t3{font:600 17px Inter,Arial,sans-serif; fill:#d7d7d7}
      .mono{font:700 18px ui-monospace,Menlo,Consolas,monospace; fill:#fff}
      .small{font:500 14px Inter,Arial,sans-serif; fill:#bdbdbd}
      .chip{font:700 14px ui-monospace,Menlo,Consolas,monospace; fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="36" y="36" width="1128" height="648" rx="26" fill="none" stroke="#2a0d10" stroke-width="2"/>
  <text x="70" y="92" class="t1">Keep the contract pure. Build the fork only when evals say you need it.</text>
  <text x="70" y="126" class="t3">A product feature should have one stable contract; model quirks belong in a separate, testable fork.</text>

  <rect x="70" y="170" width="460" height="410" rx="22" fill="url(#panel)" stroke="#e60012" stroke-width="2"/>
  <rect x="670" y="170" width="460" height="410" rx="22" fill="url(#panel)" stroke="#2f2f2f" stroke-width="2"/>

  <text x="102" y="220" class="t2">1 / Feature Contract</text>
  <text x="102" y="258" class="mono">What success looks like</text>
  <text x="102" y="302" class="small">• User goal</text>
  <text x="102" y="334" class="small">• Success criteria</text>
  <text x="102" y="366" class="small">• Context &amp; evidence</text>
  <text x="102" y="398" class="small">• Boundaries</text>
  <text x="102" y="444" class="chip">stable prompt</text>
  <text x="102" y="478" class="small">This is the product promise.</text>
  <rect x="286" y="214" width="200" height="188" rx="18" fill="#0f0f0f" stroke="#5a1d22" stroke-width="1.5"/>
  <text x="306" y="252" class="t2" style="font-size:16px">contract.md</text>
  <text x="306" y="285" class="small">Feature</text>
  <text x="306" y="313" class="small">independent</text>
  <text x="306" y="341" class="small">from model</text>
  <text x="306" y="369" class="small">version.</text>

  <text x="702" y="220" class="t2">2 / Model-specific fork</text>
  <text x="702" y="258" class="mono">What the current model needs</text>
  <text x="702" y="302" class="small">• Minimal scaffolding</text>
  <text x="702" y="334" class="small">• Vendor guidance</text>
  <text x="702" y="366" class="small">• Eval failures</text>
  <text x="702" y="398" class="small">• Smallest useful fork</text>
  <text x="702" y="444" class="chip">optional layer</text>
  <text x="702" y="478" class="small">This is not the promise — it is the adaptation.</text>
  <rect x="886" y="214" width="198" height="188" rx="18" fill="#0f0f0f" stroke="#1e3b46" stroke-width="1.5"/>
  <text x="906" y="252" class="t2" style="font-size:16px">fork.md</text>
  <text x="906" y="285" class="small">GPT-5.5</text>
  <text x="906" y="313" class="small">Opus 4.7</text>
  <text x="906" y="341" class="small">Next model</text>
  <text x="906" y="369" class="small">scaffolding</text>

  <path d="M530 378 C585 378 620 378 665 378" stroke="#e60012" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <rect x="532" y="336" width="136" height="84" rx="18" fill="#111" stroke="#e60012" stroke-width="2"/>
  <text x="550" y="367" class="t2" style="font-size:16px">eval loop</text>
  <text x="550" y="396" class="small">pass → ship</text>
  <text x="702" y="560" class="small">Failing evals should shrink the scaffold, not the product promise.</text>
  <text x="102" y="560" class="small">Start from the contract, then add only the minimum model-specific fork that keeps quality above bar.</text>
</svg>