<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#111111"/>
  <rect x="52" y="62" width="1496" height="776" rx="30" fill="#f7f4ee" stroke="#111111" stroke-width="4"/>
  <rect x="98" y="116" width="650" height="240" rx="22" fill="#111111"/>
  <text x="130" y="176" fill="#ffffff" font-size="54" font-family="Inter,Arial,sans-serif" font-weight="800">Odysseus</text>
  <text x="130" y="224" fill="#fff1f2" font-size="22" font-family="Inter,Arial,sans-serif" font-weight="600">self-hosted AI workspace</text>
  <rect x="130" y="256" width="124" height="34" rx="17" fill="#d11f2d"/>
  <text x="152" y="279" fill="#ffffff" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">self-hosted</text>
  <rect x="266" y="256" width="104" height="34" rx="17" fill="#3b82f6"/>
  <text x="286" y="279" fill="#ffffff" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">agents</text>
  <rect x="382" y="256" width="122" height="34" rx="17" fill="#16a34a"/>
  <text x="402" y="279" fill="#ffffff" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">workspace</text>

  <rect x="796" y="116" width="632" height="240" rx="22" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="828" y="160" fill="#111" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="800">仓库概览</text>
  <text x="828" y="202" fill="#d11f2d" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">定位</text>
  <text x="900" y="202" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">自托管 AI 工作台</text>
  <text x="828" y="238" fill="#3b82f6" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">功能</text>
  <text x="900" y="238" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">聊天、代理、研究、文档、邮件、日历</text>
  <text x="828" y="274" fill="#16a34a" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">部署</text>
  <text x="900" y="274" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">docker compose + 本地模型工作流</text>
  <text x="828" y="310" fill="#ca8a04" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">协议</text>
  <text x="900" y="310" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">AGPL-3.0</text>

  <rect x="120" y="392" width="1360" height="170" rx="18" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="154" y="434" fill="#111" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="800">核心判断</text>
  <text x="154" y="482" fill="#111" font-size="20" font-family="Inter,Arial,sans-serif">不是“又一个聊天框”，而是把 AI 生产流程整合成可自托管、可控、可扩展的系统。</text>
  <text x="154" y="520" fill="#555" font-size="17" font-family="Inter,Arial,sans-serif">价值在于把模型、工具和数据收回到用户可控边界内。</text>

  <rect x="120" y="582" width="445" height="180" rx="18" fill="#fff7f7" stroke="#111111" stroke-width="3"/>
  <text x="154" y="626" fill="#d11f2d" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="800">功能矩阵</text>
  <text x="154" y="668" fill="#111" font-size="18" font-family="Inter,Arial,sans-serif">Chat + Agents / Deep Research</text>
  <text x="154" y="698" fill="#111" font-size="18" font-family="Inter,Arial,sans-serif">Documents / Email / Notes / Calendar</text>
  <text x="154" y="734" fill="#555" font-size="15" font-family="Inter,Arial,sans-serif">把知识工作流程放到一个统一界面。</text>

  <rect x="595" y="582" width="885" height="180" rx="18" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="630" y="626" fill="#111" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="800">为什么值得关注</text>
  <text x="630" y="668" fill="#d11f2d" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">系统化</text>
  <text x="730" y="668" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">把单点聊天变成完整生产系统</text>
  <text x="630" y="704" fill="#3b82f6" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">自托管</text>
  <text x="730" y="704" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">适合私有工作流与可控数据</text>
  <text x="630" y="740" fill="#16a34a" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">扩展性</text>
  <text x="730" y="740" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">MCP、skills、presets、本地模型</text>
</svg>
