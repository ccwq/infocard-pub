<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#111111"/>
  <rect x="60" y="64" width="1480" height="772" rx="30" fill="#f7f4ee" stroke="#111111" stroke-width="4"/>
  <rect x="120" y="130" width="410" height="120" rx="18" fill="#111111"/>
  <text x="150" y="186" fill="#ffffff" font-size="48" font-family="Inter,Arial,sans-serif" font-weight="800">Skill by Emil Kowal</text>
  <text x="150" y="220" fill="#fff1f2" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="600">skill · design · public page</text>
  <rect x="150" y="260" width="130" height="30" rx="15" fill="#d11f2d"/>
  <text x="174" y="280" fill="#ffffff" font-size="16" font-family="Inter,Arial,sans-serif" font-weight="700">skill</text>
  <rect x="292" y="260" width="130" height="30" rx="15" fill="#3b82f6"/>
  <text x="314" y="280" fill="#ffffff" font-size="16" font-family="Inter,Arial,sans-serif" font-weight="700">design</text>

  <rect x="600" y="126" width="820" height="330" rx="22" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <rect x="650" y="176" width="340" height="214" rx="16" fill="#111111"/>
  <circle cx="708" cy="226" r="30" fill="#d11f2d"/>
  <circle cx="806" cy="226" r="30" fill="#3b82f6"/>
  <circle cx="904" cy="226" r="30" fill="#16a34a"/>
  <rect x="672" y="282" width="296" height="16" rx="8" fill="#f7f4ee"/>
  <rect x="672" y="312" width="246" height="16" rx="8" fill="#f7f4ee"/>
  <rect x="672" y="342" width="180" height="16" rx="8" fill="#f7f4ee"/>
  <text x="1018" y="212" fill="#111" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="800">页面气质</text>
  <text x="1018" y="256" fill="#d11f2d" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">极简但不空</text>
  <text x="1160" y="256" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">大留白、强标题、少模块</text>
  <text x="1018" y="292" fill="#3b82f6" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">以展示为主</text>
  <text x="1160" y="292" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">把“技能”当成果而不是说明书</text>
  <text x="1018" y="328" fill="#16a34a" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">传播性</text>
  <text x="1160" y="328" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">页面本身可成为转发对象</text>

  <rect x="120" y="378" width="1360" height="170" rx="18" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="154" y="420" fill="#111" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="800">核心判断</text>
  <text x="154" y="468" fill="#111" font-size="20" font-family="Inter,Arial,sans-serif">不是“一个功能页”，而是“一个把技能当作作品展示的公开舞台”。</text>
  <text x="154" y="506" fill="#555" font-size="17" font-family="Inter,Arial,sans-serif">标题强、模块少、留白足，强调的是技能展示与个人品牌，而不是产品说明。</text>

  <rect x="120" y="574" width="445" height="190" rx="18" fill="#fff7f7" stroke="#111111" stroke-width="3"/>
  <text x="154" y="618" fill="#d11f2d" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="800">公开页的价值</text>
  <text x="154" y="660" fill="#111" font-size="18" font-family="Inter,Arial,sans-serif">把技能、审美和创作意图</text>
  <text x="154" y="690" fill="#111" font-size="18" font-family="Inter,Arial,sans-serif">整合成可被记住的作品集</text>
  <text x="154" y="728" fill="#555" font-size="15" font-family="Inter,Arial,sans-serif">适合做个人品牌资产，而不只是说明文档。</text>

  <rect x="595" y="574" width="885" height="190" rx="18" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="630" y="618" fill="#111" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="800">可能的研究视角</text>
  <text x="630" y="660" fill="#d11f2d" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">个人品牌</text>
  <text x="760" y="660" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">把技能包装成作者资产</text>
  <text x="630" y="696" fill="#3b82f6" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">信息结构</text>
  <text x="760" y="696" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">少模块、强标题、清楚传达</text>
  <text x="630" y="732" fill="#16a34a" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">视觉记忆</text>
  <text x="760" y="732" fill="#444" font-size="16" font-family="Inter,Arial,sans-serif">留白与色块形成一眼可认</text>
</svg>
