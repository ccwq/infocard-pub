<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#111111"/>
  <rect x="56" y="70" width="1488" height="760" rx="28" fill="#f7f4ee" stroke="#111111" stroke-width="4"/>
  <rect x="96" y="112" width="640" height="250" rx="22" fill="#111111"/>
  <text x="130" y="170" fill="#ffffff" font-size="52" font-family="Inter,Arial,sans-serif" font-weight="800">有毒之人</text>
  <text x="130" y="224" fill="#fff1f2" font-size="26" font-family="Inter,Arial,sans-serif" font-weight="600">暗黑人格 · 向下渗透 · 职场防护</text>
  <rect x="130" y="252" width="140" height="34" rx="17" fill="#d11f2d"/>
  <text x="150" y="275" fill="#ffffff" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">暗黑人格</text>
  <rect x="286" y="252" width="140" height="34" rx="17" fill="#3b82f6"/>
  <text x="306" y="275" fill="#ffffff" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">组织扩散</text>
  <rect x="442" y="252" width="140" height="34" rx="17" fill="#16a34a"/>
  <text x="462" y="275" fill="#ffffff" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">防护策略</text>

  <rect x="790" y="112" width="620" height="250" rx="22" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <g>
    <rect x="820" y="142" width="172" height="80" rx="12" fill="#fff1f2" stroke="#111111" stroke-width="2"/>
    <text x="850" y="178" fill="#d11f2d" font-size="22" font-family="Inter,Arial,sans-serif" font-weight="800">4 个暗黑特质</text>
    <text x="850" y="204" fill="#555" font-size="16" font-family="Inter,Arial,sans-serif">精神病态 / 自恋 / 马基雅维利 / 施虐</text>
    <rect x="1010" y="142" width="172" height="80" rx="12" fill="#eff6ff" stroke="#111111" stroke-width="2"/>
    <text x="1038" y="178" fill="#3b82f6" font-size="22" font-family="Inter,Arial,sans-serif" font-weight="800">向下渗透</text>
    <text x="1038" y="204" fill="#555" font-size="16" font-family="Inter,Arial,sans-serif">粗暴风格会传染</text>
    <rect x="1200" y="142" width="172" height="80" rx="12" fill="#ecfdf5" stroke="#111111" stroke-width="2"/>
    <text x="1228" y="178" fill="#16a34a" font-size="22" font-family="Inter,Arial,sans-serif" font-weight="800">应对三层</text>
    <text x="1228" y="204" fill="#555" font-size="16" font-family="Inter,Arial,sans-serif">上级 / 同级 / 实操</text>
  </g>
  <text x="820" y="260" fill="#111" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="700">关键判断：不是脾气差，而是会把操控、敌意和零和思维扩散到整个团队。</text>

  <rect x="96" y="390" width="1408" height="172" rx="18" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="130" y="432" fill="#111" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="800">识别特征</text>
  <text x="130" y="472" fill="#d11f2d" font-size="20" font-family="Inter,Arial,sans-serif" font-weight="700">言语线索</text>
  <text x="270" y="472" fill="#444" font-size="18" font-family="Inter,Arial,sans-serif">频繁撒谎、叙事短却塞细节、被追问时应对困难</text>
  <text x="130" y="510" fill="#3b82f6" font-size="20" font-family="Inter,Arial,sans-serif" font-weight="700">肢体线索</text>
  <text x="270" y="510" fill="#444" font-size="18" font-family="Inter,Arial,sans-serif">假微笑、愤怒语言高频、手势压迫感强</text>
  <text x="130" y="548" fill="#16a34a" font-size="20" font-family="Inter,Arial,sans-serif" font-weight="700">稳定性</text>
  <text x="270" y="548" fill="#444" font-size="18" font-family="Inter,Arial,sans-serif">关键看长期、跨场景、稳定重复的行为模式</text>

  <rect x="96" y="586" width="688" height="168" rx="18" fill="#fff7f7" stroke="#111111" stroke-width="3"/>
  <text x="130" y="632" fill="#d11f2d" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="800">长期危害</text>
  <text x="130" y="672" fill="#111" font-size="20" font-family="Inter,Arial,sans-serif">士气下降 · 信任崩塌 · 人才流失 · 绩效受损</text>
  <text x="130" y="708" fill="#555" font-size="16" font-family="Inter,Arial,sans-serif">组织从合作系统变成防御系统</text>

  <rect x="816" y="586" width="688" height="168" rx="18" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="850" y="632" fill="#111" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="800">应对与防护</text>
  <text x="850" y="672" fill="#d11f2d" font-size="20" font-family="Inter,Arial,sans-serif" font-weight="700">对上级</text>
  <text x="940" y="672" fill="#444" font-size="18" font-family="Inter,Arial,sans-serif">温和提问、结构化回应、不情绪失控</text>
  <text x="850" y="708" fill="#3b82f6" font-size="20" font-family="Inter,Arial,sans-serif" font-weight="700">对同级 / 实操</text>
  <text x="1000" y="708" fill="#444" font-size="18" font-family="Inter,Arial,sans-serif">冷处理、清晰边界、违规有后果、争取双赢</text>
</svg>
