<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ee"/>
      <stop offset="100%" stop-color="#efe9de"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#111111" flood-opacity="0.18"/>
    </filter>
    <style>
      .ink{fill:#111}
      .red{fill:#d11f2d}
      .blue{fill:#3b82f6}
      .green{fill:#16a34a}
      .label{font-family:Inter,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-weight:800}
      .small{font-size:18px;letter-spacing:.12em}
      .mid{font-size:34px}
      .big{font-size:64px}
      .paper{fill:#fffdf8;stroke:#111;stroke-width:4}
      .wire{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect x="36" y="36" width="1128" height="568" class="paper" filter="url(#shadow)"/>
  <rect x="36" y="36" width="1128" height="88" fill="#090909"/>
  <text x="70" y="92" class="label small" fill="#fff">心理学概念 · 术语辨析 · 防御机制</text>

  <text x="68" y="190" class="label big ink">人格外化</text>
  <text x="70" y="238" class="label mid ink">不是外向，而是把内在冲突推到外部世界</text>

  <g transform="translate(72,300)">
    <rect x="0" y="0" width="260" height="140" rx="10" class="paper"/>
    <rect x="0" y="0" width="260" height="34" class="red"/>
    <text x="18" y="58" class="label mid ink">防御机制</text>
    <text x="18" y="96" class="label" font-size="22" fill="#444">把责任 / 感受 / 冲突</text>
    <text x="18" y="124" class="label" font-size="22" fill="#444">往外推</text>
  </g>
  <g transform="translate(364,300)">
    <rect x="0" y="0" width="260" height="140" rx="10" class="paper"/>
    <rect x="0" y="0" width="260" height="34" class="blue"/>
    <text x="18" y="58" class="label mid ink">叙事疗法</text>
    <text x="18" y="96" class="label" font-size="22" fill="#444">把问题和人分开</text>
    <text x="18" y="124" class="label" font-size="22" fill="#444">重建行动感</text>
  </g>
  <g transform="translate(656,300)">
    <rect x="0" y="0" width="420" height="140" rx="10" class="paper"/>
    <rect x="0" y="0" width="420" height="34" class="green"/>
    <text x="18" y="58" class="label mid ink">概念边界</text>
    <text x="18" y="96" class="label" font-size="22" fill="#444">外化 ≠ 外向 · 外化 ≠ 甩锅</text>
    <text x="18" y="124" class="label" font-size="22" fill="#444">需要看语境：精神分析 / 叙事疗法 / 文化心理学</text>
  </g>

  <path d="M290 370 L356 370" class="wire"/>
  <path d="M582 370 L648 370" class="wire"/>
  <circle cx="323" cy="370" r="12" fill="#fff" stroke="#111" stroke-width="4"/>
  <circle cx="615" cy="370" r="12" fill="#fff" stroke="#111" stroke-width="4"/>

  <text x="70" y="540" class="label" font-size="24" fill="#555">维基调查 · 学术补充 · 科普信息卡</text>
  <text x="70" y="578" class="label" font-size="22" fill="#777">让术语回到边界：先分清防御机制、疗法技术和广义概念，再谈“人格外化”。</text>
</svg>
