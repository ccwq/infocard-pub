<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b49ff"/>
      <stop offset="100%" stop-color="#8a5cf5"/>
    </linearGradient>
    <filter id="sd" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5b49ff" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="480" height="220" fill="#faf9ff" rx="14"/>

  <text x="20" y="26" font-size="10" font-weight="900" fill="#5b49ff" letter-spacing="2">THREE CORE OPERATIONS</text>
  <line x1="20" y1="36" x2="460" y2="36" stroke="#d7cfee" stroke-width="1.5"/>

  <!-- Ingest -->
  <rect x="20" y="46" width="136" height="160" rx="12" fill="white" stroke="#c4baf5" stroke-width="1.8" filter="url(#sd)"/>
  <rect x="20" y="46" width="136" height="26" rx="12" fill="#ebe7ff"/>
  <rect x="20" y="59" width="136" height="13" fill="#ebe7ff"/>
  <circle cx="38" cy="59" r="10" fill="#5b49ff"/>
  <text x="38" y="63" font-size="9" font-weight="950" fill="white" text-anchor="middle">1</text>
  <text x="88" y="64" font-size="9" font-weight="900" fill="#3a1fff" letter-spacing="1">INGEST</text>

  <text x="30" y="86" font-size="8.5" font-weight="800" fill="#111">把外部来源摄入 Wiki</text>
  <text x="30" y="98" font-size="7.5" fill="#6b6b7a">1. web_extract 获取 URL 内容</text>
  <text x="30" y="110" font-size="7.5" fill="#6b6b7a">2. 保存到 raw/articles/</text>
  <text x="30" y="122" font-size="7.5" fill="#6b6b7a">3. 检查现有页面避免重复</text>
  <text x="30" y="134" font-size="7.5" fill="#6b6b7a">4. 写/更新概念/实体页</text>
  <text x="30" y="146" font-size="7.5" fill="#6b6b7a">5. 每页 2+ [[wikilink]]</text>
  <text x="30" y="158" font-size="7.5" fill="#6b6b7a">6. 更新 index.md + log.md</text>

  <rect x="30" y="168" width="116" height="18" rx="5" fill="#f5f2ff" stroke="#c4baf5" stroke-width="1"/>
  <text x="38" y="180" font-size="7.5" fill="#5b49ff">sha256 drift 检测</text>
  <circle cx="136" cy="177" r="6" fill="#d7cfee"/>
  <text x="136" y="180.5" font-size="7" text-anchor="middle">✓</text>

  <!-- Arrow -->
  <line x1="156" y1="126" x2="172" y2="126" stroke="#8a5cf5" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Query -->
  <rect x="172" y="46" width="136" height="160" rx="12" fill="white" stroke="url(#b1)" stroke-width="2.2" filter="url(#sd)"/>
  <rect x="172" y="46" width="136" height="26" rx="12" fill="#e0dcff"/>
  <rect x="172" y="59" width="136" height="13" fill="#e0dcff"/>
  <circle cx="190" cy="59" r="10" fill="#3a1fff"/>
  <text x="190" y="63" font-size="9" font-weight="950" fill="white" text-anchor="middle">2</text>
  <text x="240" y="64" font-size="9" font-weight="900" fill="#1a0e8f" letter-spacing="1">QUERY</text>

  <text x="182" y="86" font-size="8.5" font-weight="800" fill="#111">在 Wiki 里查找并回答</text>
  <text x="182" y="98" font-size="7.5" fill="#6b6b7a">1. 读 index.md 定位相关页</text>
  <text x="182" y="110" font-size="7.5" fill="#6b6b7a">2. search_files 关键词定位</text>
  <text x="182" y="122" font-size="7.5" fill="#6b6b7a">3. 读取相关页面</text>
  <text x="182" y="134" font-size="7.5" fill="#6b6b7a">4. 综合答案并引用来源</text>
  <text x="182" y="146" font-size="7.5" fill="#6b6b7a">5. 如需持久化 → queries/</text>

  <rect x="182" y="158" width="116" height="28" rx="6" fill="#ebe7ff" stroke="#8a5cf5" stroke-width="1.2"/>
  <text x="190" y="170" font-size="7.5" fill="#3a1fff" font-weight="800">只读查询不写 log</text>
  <text x="190" y="180" font-size="7" fill="#6b6b7a">除非用户明确要求保存</text>

  <!-- Arrow -->
  <line x1="308" y1="126" x2="324" y2="126" stroke="#8a5cf5" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Lint -->
  <rect x="324" y="46" width="136" height="160" rx="12" fill="white" stroke="#c4baf5" stroke-width="1.8" filter="url(#sd)"/>
  <rect x="324" y="46" width="136" height="26" rx="12" fill="#f5f2ff"/>
  <rect x="324" y="59" width="136" height="13" fill="#f5f2ff"/>
  <circle cx="342" cy="59" r="10" fill="#8a5cf5"/>
  <text x="342" y="63" font-size="9" font-weight="950" fill="white" text-anchor="middle">3</text>
  <text x="392" y="64" font-size="9" font-weight="900" fill="#5b49ff" letter-spacing="1">LINT</text>

  <text x="334" y="86" font-size="8.5" font-weight="800" fill="#111">检查 Wiki 健康状态</text>
  <text x="334" y="98" font-size="7.5" fill="#6b6b7a">• 孤立页面（无 inbound link）</text>
  <text x="334" y="110" font-size="7.5" fill="#6b6b7a">• 失效 [[wikilink]]</text>
  <text x="334" y="122" font-size="7.5" fill="#6b6b7a">• Index 完整性</text>
  <text x="334" y="134" font-size="7.5" fill="#6b6b7a">• frontmatter 格式校验</text>
  <text x="334" y="146" font-size="7.5" fill="#6b6b7a">• 90 天+未更新的陈旧页面</text>
  <text x="334" y="158" font-size="7.5" fill="#6b6b7a">• 矛盾标记（contested: true）</text>

  <rect x="334" y="168" width="116" height="18" rx="5" fill="#f5f2ff" stroke="#c4baf5" stroke-width="1"/>
  <text x="342" y="180" font-size="7.5" fill="#5b49ff">→ log.md 记录结果</text>
  <circle cx="440" cy="177" r="6" fill="#d7cfee"/>
  <text x="440" y="180.5" font-size="7" text-anchor="middle">✓</text>
</svg>
