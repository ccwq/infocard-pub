<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8a5cf5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5b49ff" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf9ff"/>
      <stop offset="100%" stop-color="#f3f0ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b49ff"/>
      <stop offset="100%" stop-color="#8a5cf5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="260" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="24" y="30" font-size="11" font-weight="900" fill="#5b49ff" letter-spacing="2">THREE-LAYER ARCHITECTURE</text>
  <line x1="24" y1="40" x2="456" y2="40" stroke="#d7cfee" stroke-width="1.5"/>

  <!-- Layer 1: Raw Sources -->
  <rect x="24" y="52" width="140" height="180" rx="12" fill="white" stroke="#d7cfee" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="24" y="52" width="140" height="26" rx="12" fill="#e8e4ff"/>
  <rect x="24" y="65" width="140" height="13" fill="#e8e4ff"/>
  <text x="94" y="70" font-size="9" font-weight="900" fill="#5b49ff" text-anchor="middle" letter-spacing="1">LAYER 1</text>
  <text x="94" y="94" font-size="10" font-weight="950" fill="#111" text-anchor="middle">Raw Sources</text>
  <text x="94" y="106" font-size="8" fill="#6b6b7a" text-anchor="middle">不可变 · Agent 只读</text>

  <!-- File items -->
  <rect x="36" y="118" width="116" height="18" rx="5" fill="#f5f2ff" stroke="#c4baf5" stroke-width="1"/>
  <text x="44" y="130" font-size="8" fill="#3a3560">📄 raw/articles/</text>

  <rect x="36" y="142" width="116" height="18" rx="5" fill="#f5f2ff" stroke="#c4baf5" stroke-width="1"/>
  <text x="44" y="154" font-size="8" fill="#3a3560">📄 raw/papers/</text>

  <rect x="36" y="166" width="116" height="18" rx="5" fill="#f5f2ff" stroke="#c4baf5" stroke-width="1"/>
  <text x="44" y="178" font-size="8" fill="#3a3560">📄 raw/assets/</text>

  <rect x="36" y="190" width="116" height="18" rx="5" fill="#f5f2ff" stroke="#c4baf5" stroke-width="1"/>
  <text x="44" y="202" font-size="8" fill="#3a3560">📄 raw/transcripts/</text>

  <!-- Lock icon -->
  <circle cx="140" cy="230" r="12" fill="#d7cfee"/>
  <text x="140" y="234" font-size="10" text-anchor="middle">🔒</text>

  <!-- Arrow 1→2 -->
  <line x1="164" y1="142" x2="184" y2="142" stroke="#8a5cf5" stroke-width="2" marker-end="url(#arr)"/>
  <text x="174" y="135" font-size="8" fill="#8a5cf5" text-anchor="middle">摄入</text>

  <!-- Layer 2: Wiki Pages -->
  <rect x="184" y="52" width="140" height="180" rx="12" fill="white" stroke="url(#purple)" stroke-width="2.2" filter="url(#shadow)"/>
  <rect x="184" y="52" width="140" height="26" rx="12" fill="#e0dcff"/>
  <rect x="184" y="65" width="140" height="13" fill="#e0dcff"/>
  <text x="254" y="70" font-size="9" font-weight="900" fill="#3a1fff" text-anchor="middle" letter-spacing="1">LAYER 2</text>
  <text x="254" y="94" font-size="10" font-weight="950" fill="#111" text-anchor="middle">Wiki Pages</text>
  <text x="254" y="106" font-size="8" fill="#6b6b7a" text-anchor="middle">Agent 拥有和维护</text>

  <rect x="196" y="118" width="116" height="18" rx="5" fill="#ebe7ff" stroke="#a090f0" stroke-width="1"/>
  <text x="204" y="130" font-size="8" fill="#3a3560">📁 entities/</text>

  <rect x="196" y="142" width="116" height="18" rx="5" fill="#ebe7ff" stroke="#a090f0" stroke-width="1"/>
  <text x="204" y="154" font-size="8" fill="#3a3560">📁 concepts/</text>

  <rect x="196" y="166" width="116" height="18" rx="5" fill="#ebe7ff" stroke="#a090f0" stroke-width="1"/>
  <text x="204" y="178" font-size="8" fill="#3a3560">📁 comparisons/</text>

  <rect x="196" y="190" width="116" height="18" rx="5" fill="#ebe7ff" stroke="#a090f0" stroke-width="1"/>
  <text x="204" y="202" font-size="8" fill="#3a3560">📁 queries/</text>

  <!-- Wikilink indicator -->
  <circle cx="300" cy="230" r="12" fill="#e0dcff"/>
  <text x="300" y="234" font-size="10" text-anchor="middle">🔗</text>

  <!-- Arrow 2→3 -->
  <line x1="324" y1="142" x2="344" y2="142" stroke="#8a5cf5" stroke-width="2" marker-end="url(#arr)"/>
  <text x="334" y="135" font-size="8" fill="#8a5cf5" text-anchor="middle">约束</text>

  <!-- Layer 3: Schema -->
  <rect x="344" y="52" width="112" height="180" rx="12" fill="white" stroke="#d7cfee" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="344" y="52" width="112" height="26" rx="12" fill="#f0eeff"/>
  <rect x="344" y="65" width="112" height="13" fill="#f0eeff"/>
  <text x="400" y="70" font-size="9" font-weight="900" fill="#5b49ff" text-anchor="middle" letter-spacing="1">LAYER 3</text>
  <text x="400" y="94" font-size="10" font-weight="950" fill="#111" text-anchor="middle">Schema Config</text>
  <text x="400" y="106" font-size="8" fill="#6b6b7a" text-anchor="middle">约定和配置</text>

  <rect x="356" y="120" width="88" height="50" rx="7" fill="#f5f2ff" stroke="#c4baf5" stroke-width="1"/>
  <text x="364" y="133" font-size="7.5" fill="#3a3560">SCHEMA.md</text>
  <text x="364" y="144" font-size="7" fill="#6b6b7a">• frontmatter</text>
  <text x="364" y="153" font-size="7" fill="#6b6b7a">• 标签分类</text>
  <text x="364" y="162" font-size="7" fill="#6b6b7a">• 页面阈值</text>

  <rect x="356" y="178" width="88" height="24" rx="6" fill="#e8e4ff" stroke="#8a5cf5" stroke-width="1.2"/>
  <text x="400" y="193" font-size="8" font-weight="900" fill="#5b49ff" text-anchor="middle">Wikilink</text>
  <text x="400" y="204" font-size="7" fill="#6b6b7a" text-anchor="middle">[[page-name]]</text>

  <!-- Caption -->
  <text x="24" y="252" font-size="8" fill="#6b6b7a">LLM Wiki · 三层职责清晰 · Raw 只读 · Wiki 可写 · Schema 约束</text>
</svg>
