<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#0b0b0b"/>
  <rect x="24" y="24" width="1152" height="592" rx="18" fill="#111" stroke="#e60012" stroke-width="4"/>
  <text x="56" y="76" fill="#fff" font-size="32" font-family="Inter,Arial,sans-serif" font-weight="700">A/B 实验结果：Harness 的“前置配置”把 15 个任务的平均质量从 49.5 提到 79.3</text>
  <text x="56" y="112" fill="#c7c7c7" font-size="18" font-family="Inter,Arial,sans-serif">作者自测（n=15），第三方复现待补；右侧为 79.3，左侧为 49.5</text>
  <line x1="90" y1="530" x2="1110" y2="530" stroke="#666" stroke-width="2"/>
  <line x1="90" y1="150" x2="90" y2="530" stroke="#666" stroke-width="2"/>
  <text x="60" y="536" fill="#aaa" font-size="18">0</text>
  <text x="48" y="456" fill="#aaa" font-size="18">20</text>
  <text x="48" y="376" fill="#aaa" font-size="18">40</text>
  <text x="48" y="296" fill="#aaa" font-size="18">60</text>
  <text x="48" y="216" fill="#aaa" font-size="18">80</text>
  <text x="42" y="176" fill="#aaa" font-size="18">100</text>
  <!-- bars -->
  <rect x="220" y="332" width="220" height="198" fill="#5c5c5c"/>
  <rect x="220" y="332" width="220" height="198" fill="none" stroke="#fff" stroke-width="2" opacity="0.15"/>
  <rect x="560" y="212" width="220" height="318" fill="#e60012"/>
  <rect x="560" y="212" width="220" height="318" fill="none" stroke="#fff" stroke-width="2" opacity="0.12"/>
  <text x="330" y="560" fill="#fff" font-size="28" text-anchor="middle">Before</text>
  <text x="330" y="592" fill="#c7c7c7" font-size="20" text-anchor="middle">49.5</text>
  <text x="670" y="560" fill="#fff" font-size="28" text-anchor="middle">With Harness</text>
  <text x="670" y="592" fill="#c7c7c7" font-size="20" text-anchor="middle">79.3</text>
  <text x="1000" y="268" fill="#fff" font-size="72" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800">+60%</text>
  <text x="1000" y="320" fill="#c7c7c7" font-size="22" text-anchor="middle">Win rate 15/15</text>
  <text x="1000" y="350" fill="#c7c7c7" font-size="22" text-anchor="middle">Variance −32%</text>
  <text x="1000" y="380" fill="#c7c7c7" font-size="20" text-anchor="middle">Harder tasks gain more</text>
  <rect x="940" y="438" width="120" height="42" rx="21" fill="#e60012"/>
  <text x="1000" y="467" fill="#fff" font-size="18" text-anchor="middle">n=15</text>
</svg>