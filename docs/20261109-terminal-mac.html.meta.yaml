title: "terminal-mac：给 AI Agent 一台专属虚拟 Mac，系统要求与安装风险先讲清"
desc: "govijr/terminal-mac 在终端里跑一台 macOS 虚拟机，Agent 得到专属操作环境，宿主的鼠标、键盘、屏幕、剪贴板不被占用。系统要求 Apple Silicon 加 macOS 14 以上（公众号文章未写），安装为 curl|bash（风险口径：远程执行、自签名未过 notarization；缓解：固定版本、SHA-256 校验、装 ~/.local 无 sudo），首次需在 guest 内装 TerminalMacGuest.app 并授录屏与辅助功能权限。含部署四步、MCP 接入命令与 skills 通道提示、64 GiB 稀疏逻辑盘代价与该不该用的边界。Star 2275 为 2026-11-08 单点观测。"
