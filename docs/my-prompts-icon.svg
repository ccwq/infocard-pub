<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>我的提示词</title>
  <desc>卡片轮廓 + 文本行 + 复制符号 · my-prompts 独立 PWA 图标</desc>

  <!-- 底板：纸色满幅 -->
  <rect x="0" y="0" width="512" height="512" fill="#f5f2eb"/>

  <!-- 主卡片轮廓 -->
  <rect x="88" y="118" width="300" height="256" rx="14" fill="#fffdf8" stroke="#171717" stroke-width="12"/>

  <!-- 卡内文本行：首行深蓝标题条 -->
  <rect x="124" y="158" width="150" height="22" rx="5" fill="#17324d"/>
  <rect x="124" y="204" width="204" height="14" rx="4" fill="#d8d2c8"/>
  <rect x="124" y="234" width="176" height="14" rx="4" fill="#d8d2c8"/>
  <rect x="124" y="264" width="196" height="14" rx="4" fill="#d8d2c8"/>
  <rect x="124" y="294" width="132" height="14" rx="4" fill="#d8d2c8"/>

  <!-- 复制符号：前后两张叠置小卡 -->
  <rect x="300" y="288" width="108" height="108" rx="12" fill="#f5f2eb" stroke="#17324d" stroke-width="12"/>
  <rect x="332" y="320" width="108" height="108" rx="12" fill="#fffdf8" stroke="#17324d" stroke-width="12"/>
  <rect x="362" y="352" width="64" height="10" rx="4" fill="#63bd79"/>
</svg>
