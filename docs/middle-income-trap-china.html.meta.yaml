title: 中等收入陷阱：中国人均GDP离高收入国家还有多远？
desc: 什么是中等收入陷阱？中国目前人均GNI距高收入国家门槛仅差135美元，但跨越陷阱仍需突破低端制造外迁、老龄化、技术封锁、内需不足等结构性挑战。本卡梳理概念、成因、国际案例与中国现状，面向社会科普。
