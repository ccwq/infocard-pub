desc: 费曼分级 L1-L5 是一个解释难度的后设模型：从面向零背景儿童的具体类比，到与领域专家围绕前沿假设进行思想对话。卡片同时标注它不是费曼本人提出的正式教育量表，并给出受众、信息密度、对话目标与四步自检。
note: 以 graph-paper 研究手册风拆解费曼 L1-L5：区分原始费曼技巧与中文互联网后设模型，避免把“讲人话”误解为任何场景都必须降到儿童频道。
