title: "数学知识图谱核查：原帖说 531，仓库现在数到 802"
desc: "cn-math-taxonomy 用人教版教材与 2022 义务教育课标搭出知识点 DAG：802 知识点、1299 条先修边（hard 1124 / soft 175）、3355 题、310 条课标。答错先补一题，仍错才沿先修回溯，路径按年级从低到高。本卡逐条清点 raw 数据，并在本地实跑 scripts/validate.py（PASSED）与 tests/test_engine.js（82 passed）。原帖 531 / 909 / 2271 是 1–9 年级口径快照，截图里的 674 又晚了一步。作者自陈 AI 初稿未经教师审核，高中 1084 题未做盲解，CC BY-NC 4.0 商用需授权。"
