title: "Exa Search API：神经网络化 Web 搜索，专为 AI Agent 而生"
desc: "225★ exa-py / 128★ exa-js，POST https://api.exa.ai/search，支持 auto/deep/instant 三种搜索模式，auto/deep 含 LLM 生成摘要与高亮片段。按调用计费，/search 和 /contents 端点均标记 x402（需支付）。支持 x-api-key header 或 Authorization: Bearer 认证。Base URL: https://api.exa.ai，OpenAPI: https://api.exa.ai/openapi.json。"
