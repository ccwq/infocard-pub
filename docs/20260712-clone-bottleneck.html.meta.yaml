title: "Clone 是 Agent 新瓶颈 — Corigin 优化 Git Clone"
desc: "Matt Rickard 指出：Agent sandbox TTl 已优化到 690ms，但真正的瓶颈是 git clone——普通仓库需要好几秒。Corigin 从头重建 git 读路径，将 clone 降到 184–646ms，比 sandbox 启动还快。"
