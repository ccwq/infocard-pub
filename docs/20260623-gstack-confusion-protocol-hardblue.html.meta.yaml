desc: 'GStack 集成 Karpathy Confusion Protocol，在架构选型、数据建模、破坏性操作等高代价模糊点通过 ambiguity gate（模糊门）自动刹车提问，避免 AI 自信走错路导致大返工。叠加 CEO 评审强化（只评审不写代码）与 GBrain 知识库自动读写，让 Agent 学会"知道自己不知道"的元认知，从自作主张变为真正聪明的编码搭档。'
