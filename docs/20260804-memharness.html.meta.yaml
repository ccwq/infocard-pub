slug: memharness
title: MemHarness：记忆不是回放，而是重建
desc: 提出 MemHarness 框架，让 LLM Agent 主动根据当前上下文重建过去经验，而非原样回放。核心发现：直接回放记忆会产生负迁移，在未见环境中仅达 76.3%；重建范式可提升至 85.9%。方法基于 GRPO 端到端训练，基于 Qwen2.5-7B，在 ALFWorld 和 WebShop 上分别达到 85.2% 和 75.6%。
