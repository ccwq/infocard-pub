desc: 6 Star 的轻量系统信息工具。Dfetch 专注干净输出、快速启动和简单配置，不追求花哨定制，而是把 userinfo、os、kernel、uptime、cpu、ram、disk 等常用系统信息以清爽方式呈现。Go 编写，MIT 开源，支持自定义 ASCII art 和模块配置。
