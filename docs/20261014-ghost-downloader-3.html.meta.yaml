title: Ghost Downloader 3：把种子、磁力、m3u8 和 B 站视频收进一个下载器
desc: XiaoYouChR/Ghost-Downloader-3 一个应用接管 HTTP、磁力/BT、FTP、M3U8、MPEG-DASH、eD2k 六种协议，YouTube 与 Bilibili 可框选片段与画质、GitHub 与 HuggingFace 走镜像加速，浏览器扩展嗅探媒体并交给桌面端，兼容 aria2 RPC。含三步步进、四平台版本与架构要求表，以及 Android 只有 arm64-v8a、无 AVX 指令集的 CPU 不支持、插件 API 未公开等限制。GPL-3.0，9,878 star，快照 2026-10-14。
