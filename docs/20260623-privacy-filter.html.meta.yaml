desc: "packyme/privacy-filter (252⭐ · MIT · Go) 是纯 Go 写的 LLM 隐私网关：毫秒级脱敏 PII 和密钥，生产中已在用。两层检测覆盖结构化 PII 与秘密/凭据，不做 NER，只有不可逆脱敏，适合接 LLM 网关且不想引入额外模型或 GPU。"
note: "重建版隐私网关信息卡，强调两层检测（结构化 PII 正则 / gitleaks+熵兜底）、不做 NER 的延迟取舍、RE2 线性时间、核心包 / HTTP / gRPC 三种接入方式、安装构建 API 与生产使用边界。"
