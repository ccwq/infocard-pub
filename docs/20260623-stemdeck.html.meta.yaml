desc: stemdeckapp/stemdeck (1736⭐, Apache-2.0, JavaScript/Python/Rust) 是免费、本地的音频分轨工具：拖入 MP3/WAV/FLAC 或粘贴 YouTube URL，用 Meta AI Demucs htdemucs_6s 模型分离人声/鼓/贝斯/吉他/钢琴/其他 6 轨，DAW 风格混音器播放、独奏、导出。无需账号、无需上传、无需订阅。支持 Windows/macOS/Linux，CUDA/MPS/CPU 自动检测。
note: 6 轨分离 + DAW 混音器 + BPM/调性/LUFS 分析 + 与 Moises/LALAL.AI 诚实对比 + 三种安装方式 + REST API + 配置项 + 键盘快捷键 + 技术栈（Demucs/FastAPI/Tauri v2/原生 JS）。
