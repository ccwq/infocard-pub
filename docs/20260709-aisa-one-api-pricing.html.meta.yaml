desc: AIsa（aisa.one）是 AI Agent 经济体的统一能力层，提供 LLM 模型网关和 100+ 数据 API。计费分为两类：LLM 按 Token 量计费（USD/1M Token），数据 API 按次固定费用（$0.02/调用）。支持法币和 USDC 稳定币充值，x402 协议支持 Agent 自主支付。覆盖 GPT、Claude、Gemini、DeepSeek、Qwen、Kimi、MiniMax 等主流模型及 Twitter、Polymarket、YouTube、Financial 等数据源。
