desc: EverMind-AI/EverOS (8408⭐ · Apache-2.0 · Python) 提出面向 Agent 的第四种 memory 路线：把记忆做成可读、可编辑、可版本管理、可由人和 Agent 共同维护的知识层。支持 Markdown 源、用户/Agent 双轨记忆、本地 SQLite + LanceDB、混合检索、多模态摄入和自演化。
note: 重建版 EverOS 信息卡，聚焦四种记忆路线（Context / RAG / Memory API / EverOS）、Markdown 源头、双轨记忆、本地三件套、多模态摄入、自演化、安装配置与卸载边界。
