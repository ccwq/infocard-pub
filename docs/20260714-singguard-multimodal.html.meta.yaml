title: SingGuard — 政策自适应多模态安全护栏
desc: SingGuard：蚂蚁集团 AI 安全实验室开源的政策自适应多模态安全护栏，支持文本、图像、图文组合的多模态安全评估。合规规则作为运行时输入，无需重训模型，支持动态参数切换。2B/4B/8B 三种规格，Hugging Face 开源，6 大基准 SOTA。
