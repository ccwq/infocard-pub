title: "Heretic：自动搜索 Abliteration 参数的语言模型研究工具"
desc: "Heretic 将 directional ablation（abliteration）与 Optuna TPE 搜索结合，以拒答数量和相对原模型的 KL divergence 为双目标，自动寻找模型处理参数。本卡梳理其机制、兼容范围、环境与显存考量、官方 benchmark 口径及派生模型的安全与许可边界。"
