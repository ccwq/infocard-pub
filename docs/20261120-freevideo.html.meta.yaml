title: "FreeVideo：8G 显存跑 MiniMax H3 的本地推理引擎——官方文档核查与上手"
desc: "按官方 README、执行规划器、社区实测表与中文使用说明逐条核查公众号推文：8GB 显存 + 16GB 内存门槛、OpenVDN 8 步 VDN-H3 派生权重（约 22.9GB FP8，非 H3 原版）、四条安装路线与夸克离线包、四档质量与半分辨率预览、参考一致性官方明示为实验能力不保证、3090 按官方社区表对照（10s/Light v0.3.23 为 704 秒，文章“四百秒上下”更接近 6.6 秒片长或 v0.4.19 记录，不作必错断言）、权重许可排除欧盟/英国/韩国/美国、--listen 0.0.0.0 凭 token 放行且默认不加密。含失败排查与该不该用的边界。Star 不写精确数（2026-11-20 单点观测约 3000+，随时漂移）。"
