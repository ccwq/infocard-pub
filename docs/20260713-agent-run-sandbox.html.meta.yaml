title: "agent-run — 用 bwrap 把 Coding Agent 装进沙箱"
desc: "sin-ack/agent-run 是一个 Rust 小工具，把 Codex、Claude Code、OpenCode、Pi 等 Coding Agent 套进基于 bwrap 的 Linux 沙箱：系统文件默认只读、项目目录可写、TOML 配置网络和挂载、JSON Schema 编辑器补全、单文件二进制 <1MB。核心价值是减少权限弹窗、降低误改本机文件风险；不是 microVM 级绝对隔离。"
