title: pi-vcc · 不调用 LLM 的会话压缩器
date: "2026-06-19 06:08:42"
updated: "2026-06-19 06:08:42"
desc: sting8k/pi-vcc 是 Pi agent 的纯算法会话压缩器，不调用 LLM、确定性输出、35–99.8% 压缩；用 5 个语义切片+滚动转录覆盖摘要，原始 JSONL 通过 vcc_recall 跨压缩可搜，支持正则与多词 OR 排序。
note: pixelstack 主题首张落地卡：金字塔四层映射 JSONL → 切片 → 转录 → 召回，思考者立顶、消散箭头承载金句"越远离 LLM 摘要，越接近确定性记忆"。
