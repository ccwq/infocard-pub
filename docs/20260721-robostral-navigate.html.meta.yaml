highlights:
  - Robostral Navigate 是 Mistral 首个具身导航模型，8B 参数，单 RGB 摄像头，无 LiDAR/depth
  - R2R-CE 基准 unseen 76.6%（超多传感器方案 4.5 分），seen 79.4%
  - 训练数据 240 万轨迹 / 35 万场景（仿真），前缀缓存压缩 22× token
  - CISPO 在线强化学习提升成功率 +3.2%
  - 支持 wheeled/legged/flying 机器人，跨形态泛化
  - X @TeksCreate 帖将具身导航误读为"网页自动化 runtime"，属类别错误
