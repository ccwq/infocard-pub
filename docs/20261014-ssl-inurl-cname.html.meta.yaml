title: "把域名验证权交给第三方：ssl.inurl.link 的 CNAME 委派核查"
desc: "一篇微信推广文引出的 SSL 证书托管服务核实：DNS-01 验的是什么、CNAME 委派如何把「应答挑战」外包给平台、委派后平台即可为你的域名申领证书（acme-dns README 口径）、私钥归谁与「私钥不变」意味着什么、平台停服时的可退出性、安装环节仍需手动。含文章与站内 7 条口径冲突对照（免费版 2 个域名额度、每域名每年手动点一次续签、CNAME 一条还是两条）、四条自持替代路线（自建 acme-dns / acme.sh 或 certbot + DNS API / cert-manager cnameStrategy / Cloudflare 与 Caddy）、一份可用 dig 与 openssl 自验的试点步骤，以及落地页未见隐私政策与服务条款字样的实测观察。"
