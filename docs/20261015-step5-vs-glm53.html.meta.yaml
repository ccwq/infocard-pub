title: Step 5 Preview vs GLM-5.3：一次对战能说明什么，两个许可条款实际长什么样
date: "2026-10-15 19:01:40"
updated: "2026-10-15 19:01:40"
desc: 核对公众号《Step 5 Preview 正面对上 GLM-5.3》这次模型对战的证据边界，并按两个 HF 仓库的 LICENSE 原文逐条列出许可条款：Step 5 的 StepFun Model License 1.0（MaaS 合并收入连续 12 个月超 2000 万美元须另签商业许可协议，月活超 1 亿或收入超 2000 万美元须显示 Powered by StepFun A）与 GLM-5.3 的 MIT 式授权加第 2 条 MaaS 条款（合计收入连续 12 个月超 100 亿美元须过 Z.AI 安全审查）。同时给出 BF16 权重约 1214.9 GB 与官方 4–16 卡 B300/H200 部署门槛、cache hit 与 miss 输入价差 10 倍的定价细节。关键词：Step 5 Preview、GLM-5.3、开源权重、许可证、Maas、自部署、vLLM、H200、B300。
