title: Windows Terminal：微软的现代命令行入口
desc: Windows Terminal 把 CMD、PowerShell、WSL 统一到一个现代终端里，支持多标签、GPU 硬件加速、Cascadia Code 与主题定制。适合需要在 Windows 上同时管理本地命令行、PowerShell 自动化和 Linux 子系统的重度用户。
