title: "Serena 接 Codex 省不省 token：90% 这个数从哪来，三份实测又是怎么测的"
desc: "X 原帖称 Codex 6.1 接 Serena token 消耗直接降 90%，但未给仓库、任务、模型或测法，官方评测也从未公布 token 百分比。三份独立实测互相矛盾：九工具基准在约 30 文件 Python 项目上给 -66.1%，同报告里另一款同类工具却是 +15.7%；一次 Rails 重构实测中 Serena 上下文反而多用 25k，且 36 个工具定义每请求固定占用约 11.4k；独立讨论里强模型无收益、工具 schema 多吃 15%–158% 输入，弱模型却把歧义重命名从 3/3 失败救到 1/3。含官方安装与 Codex 接入配置、LSP 后端能力缺口和自查方法。"
