slug: billion-context
title: billion-context · 上下文压缩代理完全指南（初学者向扩写版）
desc: billion-context 是 AI 编程助手的本地上下文压缩代理，在请求到达模型前插入五步压缩管线，将上下文稳定在约 150K tokens，Token 消耗降低约 5 倍。本文为初学者提供三分钟上手指南、三种使用路径详解、各客户端逐个配置指南、MITM 模式三步实操、压缩引擎 acp-kernel 调参手册、会话机制与会话迁移、GFW 上游代理配置、Plugin 模式详解、故障排查速查表，以及 20+ 条 FAQ 全面解答。 支持 OpenCode / Codex / Pi / Cursor / Aider / Continue 等主流客户端，Launcher 模式一行命令即用，零配置前缀模式开箱即用，MIT 许可证。
