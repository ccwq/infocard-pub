desc: "DeerFlow（Deep Exploration and Efficient Research Flow）是字节跳动开源的长程 SuperAgent harness，基于 LangGraph + LangChain 从头重写。它能研究、写代码、做内容一条龙，内置沙箱执行环境、长期记忆、技能系统和子代理并行编排，处理从几分钟到几小时的长程任务。73k stars、MIT 协议、6 月仍在密集更新。适合想自己搭「研究员+程序员」合体 agent 的人，也适合关注 Manus/OpenClaw 路线的人本地部署试水长任务自动化。"
tags: [deer-flow, bytedance, agent, long-task, sandbox, open-source, hardblue]
