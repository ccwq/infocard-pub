desc: "multica-ai/andrej-karpathy-skills 是开发者张家园基于 Andrej Karpathy 对 LLM 编码陷阱的公开观察提炼出的 CLAUDE.md 行为规范。四条原则——编码前先思考、简洁优先、外科手术式改动、目标驱动执行——直接约束 Claude Code 的编码行为，减少静默假设、过度工程和乱改无关代码。180K stars，MIT 开源，支持插件全局安装或按项目下载 CLAUDE.md，兼容 Cursor。"
