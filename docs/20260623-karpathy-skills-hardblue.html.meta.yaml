desc: "multica-ai/andrej-karpathy-skills 是一份从 Andrej Karpathy 对 LLM 编码陷阱的观察中提炼出的 CLAUDE.md 行为规范。它用四条原则——编码前先思考、简洁优先、外科手术式改动、目标驱动执行——直接约束 Claude Code 的编码行为，减少静默假设、过度工程和乱改无关代码。支持插件全局安装或按项目下载 CLAUDE.md，兼容 Cursor，MIT 开源。"
