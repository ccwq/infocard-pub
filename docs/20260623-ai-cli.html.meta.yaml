desc: ai-cli.dev 是一个可在终端直接生成图像、视频和文本的 CLI：npm 全局安装，多模型并行比较，管道式输入输出，支持 OpenAI、Anthropic、Google、Black Forest Labs、ByteDance 等通过 Vercel AI Gateway 访问。适合 Agent 用命令行直接做生成任务。
note: 强调终端生成、多模型比较、管道化输入输出，以及通过 Vercel AI Gateway 接入多家模型厂商。
