title: Open R1 · DeepSeek-R1 训练全流程开源复现指南
desc: Hugging Face Open R1（26.4k Stars）把 DeepSeek-R1 的训练配方完整开源：从数据生成（Distilabel）、SFT 微调、GRPO 强化学习到四大评测基准（AIME 2024 / MATH-500 / GPQA Diamond / LiveCodeBench）。Step 1 已完成（Mixture-of-Thoughts 35万条数据蒸馏），Step 2/3 进行中。本卡含完整安装命令、硬件要求、评测结果对比与六步复现 SOP。
