<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>cangjie-skill：把书/视频/播客的方法论蒸馏成可执行 AI Skills</title>
  <style>
    :root{--bg:#070b18;--bg2:#0c1430;--panel:#111a33;--panel2:#0b1124;--ink:#eef4ff;--muted:#a8b7df;--line:rgba(255,255,255,.13);--cyan:#58c3ff;--blue:#4a78ff;--green:#2db36a;--yellow:#f4c84c;--purple:#8459ff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 5%,rgba(88,195,255,.28),transparent 34%),radial-gradient(circle at 88% 4%,rgba(132,89,255,.24),transparent 34%),linear-gradient(180deg,var(--bg),#040713);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{padding:26px 14px}.wrap{width:min(1120px,100%);margin:0 auto;display:grid;gap:18px}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,rgba(17,26,51,.94),rgba(11,17,36,.86));box-shadow:0 30px 90px rgba(0,0,0,.45);padding:28px}.hero:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 210deg,transparent,rgba(88,195,255,.18),transparent,rgba(132,89,255,.18),transparent);animation:spin 18s linear infinite}.hero>*{position:relative}@keyframes spin{to{transform:rotate(360deg)}}.top{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:stretch}.kicker{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:rgba(255,255,255,.06);color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.title{margin:18px 0 12px;font-size:clamp(40px,7vw,82px);line-height:.92;font-weight:950;letter-spacing:-.07em}.title span{display:block;background:linear-gradient(90deg,#fff,var(--cyan),var(--purple));-webkit-background-clip:text;color:transparent}.lead{max-width:660px;color:var(--muted);font-size:17px;line-height:1.72}.pills{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.06);font-size:12px;color:#dbe7ff}.pill.hot{background:linear-gradient(90deg,var(--blue),var(--purple));color:#fff;border:0}.orb-card{display:grid;grid-template-rows:auto 1fr;gap:14px;border:1px solid var(--line);border-radius:24px;background:rgba(11,17,36,.72);padding:16px}.orb-row{display:flex;align-items:center;gap:14px}.orb{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--cyan) 0%,var(--blue) 50%,var(--purple) 100%);display:grid;place-items:center;font-size:22px;font-weight:950;color:#fff;letter-spacing:-.06em;box-shadow:0 8px 22px rgba(88,195,255,.28);flex-shrink:0}.metric b{display:block;font-size:22px;font-weight:950;color:#fff}.metric{font-size:13px;color:var(--muted);line-height:1.5}.terminal{border:1px solid var(--line);border-radius:16px;background:#070b18;overflow:hidden}.termbar{display:flex;gap:6px;padding:8px 10px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--line)}.dot{width:10px;height:10px;border-radius:50%;background:#ff5f57}.dot:nth-child(2){background:#febc2e}.dot:nth-child(3){background:#28c840}.term{padding:10px 12px;font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.7;color:#c5d2f7}.section{display:grid;gap:14px}.section h2{font-size:13px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px;display:grid;gap:8px}.icon{font-size:11px;font-weight:900;color:var(--cyan);letter-spacing:.06em}.card h3{font-size:14px;font-weight:900;color:var(--ink);margin:0}.card p{font-size:12.8px;color:var(--muted);line-height:1.65;margin:0}.bar{height:8px;border-radius:999px;background:#070b18;border:1px solid var(--line);overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--purple))}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;background:rgba(255,255,255,.05);color:var(--muted);margin:2px}.cmd{border:1px solid var(--line);border-radius:12px;background:#070b18;padding:10px 14px;font-family:ui-monospace,monospace;font-size:12px;color:#7ad9ff;overflow-x:auto}.cmds{display:grid;gap:8px}.footer{border:1px solid var(--line);border-radius:18px;background:var(--panel2);padding:14px 16px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;font-size:12px;color:var(--muted)}.source{line-height:1.7}.source a{color:var(--cyan)}.highlight-box{border:1px solid rgba(88,195,255,.28);border-radius:16px;background:rgba(88,195,255,.07);padding:16px;margin-top:10px}.highlight-box h4{font-size:13px;font-weight:900;color:var(--cyan);margin:0 0 8px}.highlight-box ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.8;color:var(--muted)}.highlight-box li{margin-bottom:4px}.phase-list{display:grid;gap:10px}.phase{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:12px 14px}.phase-num{font-size:11px;font-weight:950;color:var(--cyan);font-family:ui-monospace,monospace;padding-top:1px}.phase h4{font-size:13px;font-weight:900;color:var(--ink);margin:0 0 4px}.phase p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.04);color:var(--muted);margin:2px}.tag.green-tag{background:rgba(45,179,106,.12);border-color:rgba(45,179,106,.3);color:#90f0a8}.tag.yellow-tag{background:rgba(244,200,76,.12);border-color:rgba(244,200,76,.3);color:#fff0bf}.tag.cyan-tag{background:rgba(88,195,255,.12);border-color:rgba(88,195,255,.3);color:#d8f4ff}.tag.purple-tag{background:rgba(132,89,255,.12);border-color:rgba(132,89,255,.3);color:#ede3ff}.diff-table{width:100%;border-collapse:collapse;font-size:12.5px}.diff-table th{text-align:left;padding:8px 12px;background:var(--panel);border:1px solid var(--line);color:var(--cyan);font-weight:900;font-size:11px;letter-spacing:.08em}.diff-table td{padding:8px 12px;border:1px solid var(--line);color:var(--muted);line-height:1.6}.diff-table tr:hover td{background:rgba(255,255,255,.03)}.diff-table .me{color:var(--ink);font-weight:700}.skill-table{width:100%;border-collapse:collapse;font-size:11.5px}.skill-table th{padding:7px 10px;background:var(--panel);border:1px solid var(--line);color:var(--cyan);font-weight:900;text-align:left;font-size:10.5px;letter-spacing:.06em}.skill-table td{padding:7px 10px;border:1px solid var(--line);color:var(--muted)}.skill-table tr:hover td{background:rgba(255,255,255,.03)}.skill-table .num{color:var(--yellow);font-weight:900}.eco-tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.eco-card{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:18px 14px;text-align:center;display:grid;gap:10px;align-items:center}.eco-icon{width:44px;height:44px;border-radius:14px;margin:0 auto;display:grid;place-items:center;font-size:18px;font-weight:950;color:#fff}.eco-card h3{font-size:14px;font-weight:900;margin:0}.eco-card p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}.pressure-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.pressure-card{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px;display:grid;gap:8px}.pressure-card h4{font-size:13px;font-weight:900;color:var(--ink);margin:0}.pressure-card p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}@media(max-width:900px){.top{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.eco-tri{grid-template-columns:1fr}.pressure-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid4,.grid3,.pressure-grid{grid-template-columns:1fr}}
  </style>
</head>
