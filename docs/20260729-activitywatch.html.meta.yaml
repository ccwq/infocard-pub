title: ActivityWatch：把时间使用变成可观察数据
desc: ActivityWatch 是开源的被动式自动时间追踪工具，无感记录应用和网页使用时长，数据保存在本地，并通过 Web 仪表盘展示时间分布。开启开机自启后，才能形成连续的个人时间账本。
