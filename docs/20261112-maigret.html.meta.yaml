title: "Maigret：按用户名跨站收集账号档案的开源命令行工具"
desc: "基于 2026-11-12 对 maigret 0.6.6 的 PyPI 实跑与 main 分支源码核对：内置库 5,897 站（启用 5,203），工具自报 58.58% 检查属弱信号；本卡梳理 CLAIMED 四态判读规则、四个已知假阳性来源（presence 默认真、仅看状态码、反代丢状态码、disabled 站点）、并发/代理默认值，并给出只用合成用户名 noonewouldeverusethis7 的可复现演示。同名账号不等于同一人，演示不针对真实个人。"
