desc: OpenWiki 是 LangChain 开源的 Agent 自维护文档 CLI，npm install 后自动给代码库生成文档、持续更新，并在 AGENTS.md / CLAUDE.md 里追加提示让 coding agent 参考。内置 GLM 5.2 / Kimi K2.6 / Sonnet 5 等模型，支持 GitHub Action 每日自动 PR 更新文档。
