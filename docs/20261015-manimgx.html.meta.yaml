title: "ManimGX 核查：90.6× 的出处，以及 MIT 之外的那一半"
desc: "Rust + wgpu 渲染、Manim CE 的 Python API，宣称比 ManimCE 快 90.6×。数字可查：36.2 秒视频，ManimGX 3.078 秒，ManimCE 278.826 秒，benchmarks 目录公开了 45 次运行的原始记录。三个限定必须一起读——单机 Apple M4 Pro、5 个场景、且 ManimGX 与 ManimGL 跑 3 次取均值而 ManimCE 与 Blender 只跑 1 次。许可不是单纯 MIT：自有代码 MIT，原生 wheel 内含 x264 整体按 GPL-3.0-or-later。含 3D 场景跳过排版检查这条边界。"
