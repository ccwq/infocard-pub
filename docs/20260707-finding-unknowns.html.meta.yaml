desc: 基于 Anthropic Thariq 的《A Field Guide to Fable》方法论，bozhouDev/finding-unknowns-skills（26⭐）将 AI Coding 工作流从"优化 prompt"重塑为"管理未知项"。核心问题：AI Coding Agent 默认"走最短路径"，在未知项上按"业界最佳实践"猜——写得太细，AI 该变通时不敢变通；写得太粗，AI 用"通用经验"猜你想要什么。涵盖四类未知项分析（我知道我知道的/我知道我不知道的/我知道但没说出来的/我根本没意识到自己不知道的）、盲区扫描、多版原型、AI 采访、测验合并等完整流程，并提供可直接使用的 CLAUDE.md 模板。
