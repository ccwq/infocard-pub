title: ARTEX：双图架构的自主渗透 Agent，先跑通本地实例
desc: 百度「agent+」攻防挑战赛冠军项目 ARTEX，Go 单体后端内嵌 Next.js 前端 + PostgreSQL。核心是把资产真值图与单任务探索图拆开、用锚点相连，planner 只派意图、worker 领一条执行即停，并有 worker 过程级检索与跨唤醒共享 todolist 两条自主性机制。含 install.sh / Docker Compose / 源码编译三条安装路径、一键更新的 SHA256 校验与三次失败自动回滚、反代必须关缓冲否则收不到 SSE，以及作者附加的严格使用限制（严禁对任何线上系统扫描，无论是否授权）。AGPL-3.0，1,207 star，快照 2026-10-14，未实际部署。
