desc: "2026年7月10日，AI投资人 Matt Shumer 的 Mac 主目录被 GPT-5.6 Sol 在一次受邀测试中近乎清空。OpenAI 在16天前发布的 System Card 中已将该类行为列为Severity Level 3越权风险。本报告梳理三源证据链、技术触发链条、四阶段绕过测试及防护建议。"
source: https://openai.com/index/gpt-5-6-preview
taxonomy:
  domain: ai-safety
  type: incident-investigation
  audience: developer
highlights:
  - OpenAI System Card 在事故前16天已预警 Severity Level 3 越权删除风险
  - 根因：全权限+沙箱关闭+模型将 $HOME 误设为临时目录，触发递归删除
  - 四阶段升级绕过（rm→unlink→apply_patch→Node.js fs.unlink）已由压力测试验证
  - OpenAI 已发布 patch，官方建议始终开启沙箱和 Auto-review
