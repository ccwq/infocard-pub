title: avante.nvim：在 Neovim 侧边栏里让 AI 直接改代码
desc: Neovim 的 AI 编码插件 avante.nvim，侧边栏对话改选中代码块，agentic 模式自己调工具改文件、跑 bash、搜网页，也可走 ACP 接 codex / gemini / claude-code 等外部 agent。含 lazy.nvim 最小配置与 build 字段必设、version 不能设 * 两条硬要求，Claude Pro/Max 浏览器授权与 AVANTE_ 环境变量两种认证，以及早期阶段、RAG 需另装、MCP 需 mcphub、默认输入提供器建议换 snacks 等限制。作者 yetone 用 /loop 挂 3 条提示词日更，但 /loop 是会话内定时、非常驻后台。Apache-2.0，18,189 star，快照 2026-10-14。
