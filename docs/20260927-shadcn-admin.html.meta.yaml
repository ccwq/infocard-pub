title: shadcn-admin — Admin Dashboard UI
desc: 接活做管理后台，界面这块基本可以省了。shadcn-admin 是一套成品界面：10+页面现成，侧边栏、内置搜索、明暗主题、响应式布局、RTL语言支持、ARIA无障碍，开箱即用。底层是 Shadcn UI + Vite + TanStack Router + TypeScript，登录接 Clerk。MIT 许可证。
