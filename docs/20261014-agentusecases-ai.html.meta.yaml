desc: 一个由 Alex Finn 人工审核的 AI agent 真实用例目录，来源自述为 open web / X / Reddit / Hacker News，可按 11 个 topic 与 27 个 agent 浏览，每条带所用 agent、来源与 View prompt。含推文 6 条口径核查（「每天扫描整个互联网」只是来源模糊说法、「邮件每天早上 5 个案例」未核实、「完全免费无付费墙」非站点承诺），以及首页 1,273 条与 agents 页 1,267 条自相矛盾、提交热度导致覆盖不均等边界。快照 2026-10-14，未注册未订阅。
