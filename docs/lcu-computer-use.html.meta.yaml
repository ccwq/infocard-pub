title: LCU — 把 Codex CUA 运行时解耦出来，任意 Agent 工具都能用
desc: 无需 Codex 账号，直接复用本机 ChatGPT 桌面版的 CUA 运行时，通过 MCP 接入 Claude Code、Pi、Codex CLI 等主流 Agent 工具。双工具接口（js / js_reset），模型写 JS 操作桌面，支持 macOS Apple Silicon + Linux X11 ARM64/x86-64。
