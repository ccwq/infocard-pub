title: claude-video：让 Claude 看懂任何视频
desc: Claude Code 原生不支持视频输入，claude-video 通过 yt-dlp 下载、ffmpeg 帧提取、原生字幕或 Whisper API 转写，配合 Claude 多模态 Read 工具，实现真正基于画面和音频的视频理解。GitHub 16K+ stars，纯 stdlib Python。
