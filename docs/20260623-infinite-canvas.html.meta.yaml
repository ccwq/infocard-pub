desc: "basketikun/infinite-canvas (1995⭐ · AGPL-3.0 · TypeScript) 是面向 AI 创作的开源无限画布工作台：把画布编排、AI 生图、参考图编辑、对话助手、提示词库和素材沉淀放在同一个界面里，支持本地 Agent、MCP、OpenAI 兼容接口、Vercel / Docker 部署。"
note: "强调画布工作流、AI 生图 / 图生图 / 参考图编辑、本地 Agent 与 MCP、提示词库和素材沉淀；这是把创作从一次性对话变成可持续编排工作台的项目。"
