title: Herdr Cookbook：从入门到 Agent 协作的终端工作台手册
desc: Herdr 三线产品手册——Herdr App 图形工作台、herdr-core 后台终端运行时、Herdr TUI 独立复用器，三者命令与 Agent 会话不互通。覆盖 PowerShell 安装与 5 分钟启动第一个 Claude Code、AGENTS.md/hc --skill/TUI Skill 三种 Agent 材料、hc run/attach/wait/read/send 协作链路与父子 Agent 回报、SSH 远程机器纳管、布局与 Worktree 工作流定制、OSC 7501 状态协议与关闭 App 后任务边界，附六项验收清单。用户供稿，命令以官方文档为准未在本机执行。
