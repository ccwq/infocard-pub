category: 知识管理
tags: [LLM, 知识库, 分类器路由, CROW, PKM, RAG, Markdown, Ollama, 开源工具]
desc: crow-hq/llm-wiki-v2 把散落文档自动归档成结构化 Markdown 维基，提问给出引用到具体笔记的答案。关键设计是用小型分类器（CROW 论文）替代大模型决定内容归属：归档正确率 89% vs 经典 62%、入库快 2.1 倍、token 少 68%。基于 Google OKF v0.2 格式，AGPL-3.0。
lang: zh-CN