risks:
  - Replay Test Suites 已于 2024 年 8 月停止服务（与当前 Replay QA 为不同产品线）
  - 本地应用需启用反向代理才可连接
  - React 深度分析需应用本身使用 React 且开启 Source Maps
  - GitHub App 集成需仓库管理员授权
  - API 模式需 Bearer Token，密钥须安全保管
