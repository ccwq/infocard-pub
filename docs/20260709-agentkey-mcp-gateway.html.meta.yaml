desc: Chainbase Labs 出品的 AI Agent 统一数据网关（Apache-2.0，204⭐）。一条命令通过 MCP 接口接入网页搜索、X/Twitter、LinkedIn、Reddit、Instagram、YouTube、链上数据等，无需逐平台申请 API。需要注册 console.agentkey.app 并充值 Credits，非完全免费。存疑项：许可证双声明（Apache-2.0 vs MIT）、Credits 单价未核实。
