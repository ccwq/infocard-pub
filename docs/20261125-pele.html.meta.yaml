title: "Pele：Obsidian 官方 Mermaid→SVG 渲染库，零依赖同步渲染"
desc: "Obsidian 官方开源库（4,675 star，2026-11-25 快照，kepano 主导）：render() 同步返回 SVG、零运行时依赖，CSS 变量换主题不重渲染，小屏重排而非缩放；支持 Mermaid 12.1.0 全图型，可按需注册减包。官方对比口径 gzip 230 kB、0.05–0.3 ms（自测未复现）。API 三入口、对比表、主题变量、安全模型与 1.10.0 升级风险一卡看完。"
