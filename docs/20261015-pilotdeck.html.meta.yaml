title: PilotDeck：开源 Agent 工作台，文章说的 2.0 不存在
desc: 清华 THUNLP、面壁智能等四家联合开发的开源 Agent 工作台。推荐文称「升级到 2.0」，但 releases 与 tags 里没有任何 2.0 版本号；「内置三大办公 Skill」实为仓库 skills/ 目录 32 个中来自 Anthropic Skills 上游的三份文件；「数据全本地」仅在配 Ollama 时成立。含官方成本数据与 AGPL-3.0 网络条款。未实机运行。
