desc: portless.sh 让本地开发摆脱端口号：把 localhost:3000 之类的数字端口换成稳定的命名 .localhost URL，支持 HTTPS/HTTP2、自动 CA、子域名、custom TLD、git worktrees、清晰的 package.json 脚本接入。适合人和 Agent 并行开发，解决端口冲突。
note: 强调命名 localhost URL、HTTPS 默认开启、自动 CA、子域名与 git worktrees 组合，减少端口冲突和环境切换成本。
