title: "8 个小众风格组件库选型：手绘、贴纸、黏液与 Agent 工作台"
desc: "@Justin1024go 发帖称「设计SKILL根本没用，用好组件库就够了」，并列出 8 个小众风格组件库。本卡将其清单逐家对照官网与 GitHub 核验（2026-11-08）：8 家全部可达、帖内描述与官方自述基本吻合，其中 4 家带 Agent 状态、工具调用、审批等 AI 原生组件（Solid Glass、AffectUI、BoardUI 等），3 家含付费层（AffectUI Pro 买断 $249 起、Prestige All Access $79、BoardUI 10 个 Pro 模板），多数支持 shadcn registry 或 npm 一行安装。含暴论原文引用与平衡分析、8 库名录表（风格/技术栈/安装/付费/Star 带观测时点）、逐库条目、按需求选型映射、npm 与 shadcn copy-paste 两种安装模式说明，以及安装命令未获取、单组件付费归属未证实等待核验边界。"
