title: "Indra OCR：跑在 CPU 上的约 1M 参数 OCR，PDF 与图片转带版面 Markdown"
desc: "Datalab 2026-10-13 建仓的 CPU OCR：ONNX Runtime 推理、无 PyTorch，默认模型约 76 MB；官方口径 OmniParseBench 综合 66.7（PP-StructureV3 为 58.4），32 核吞吐约 44 页/秒。卡片逐条核对推文说法（1M 参数只对主识别器成立、star 数当前 1324）、给出安装到 JSON 核验的最短路径、标注厂商自测跑分口径与许可限制（权重为修改版 OpenRAIL-M，不得与 Datalab API 竞争性使用），并列明复杂表格、手写 25.2%、退化扫描 29.5% 三条官方短板。"
