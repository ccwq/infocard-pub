desc: 河南广播电视台都市频道调查记者魏华（笔名都市大先生），2026年3月19日深夜因突发心脏疾病去世，年仅45岁。他匿名暗访十余年，参与梅姨案追踪报道、婴谋贩婴链卧底（5天跨5省救5婴）、疯狂的偷窥偷拍黑产（5亿关注）、缅甸电诈120天卧底等重大调查。梅姨于其去世后两天落网。
