title: WebMCP — 浏览器代理协议的开放标准
desc: WebMCP（Web Model Context Protocol）是 W3C 社区组提出的开放标准，通过 document.modelContext API 将网页功能暴露为结构化工具，让 AI 代理可靠地操作网页，取代 DOM 抓取时代脆弱的"猜测 DOM / 截图 / 模拟点击"循环。
