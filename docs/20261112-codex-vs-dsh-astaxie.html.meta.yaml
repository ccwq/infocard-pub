title: "能用 Codex 了，为什么还要自己的 Harness？astaxie 观点核实与选型边界"
desc: "astaxie 的 X 长文用精装房与毛坯房回答群友提问：Skill 是往现成产品里加能力，Harness 是把 Agent 结构交给你。本卡逐条分级核实：Codex 官方文档证实其有 exec、TS/Python SDK、app-server 与逐线程配置，不存在虚假二元；DSH 官方材料证实 MIT、everything-is-a-plugin、四种运行形态与 Python SDK 嵌入，但 README 明确 developer preview 会有破坏性变更，sdk-minimal 固定 danger-full-access。飞书告警链路为群友自述未独立验证，作者存在利益关联，观点与事实全程分开标注。"
