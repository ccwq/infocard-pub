<body>
  <div class="page">
    <div class="page-inner">
      <div class="hero-card">
        <div class="hero-top">
          <div class="hero-copy">
            <h1>infocard-pub</h1>
            <p>红黑瑞士风信息卡档案馆。所有已发布信息卡以高密度目录形式居中展示，支持搜索、标签筛选与快速跳转。</p>
          </div>
          <div class="hero-stats">
            <div class="stat"><div class="n" id="count-total">—</div><div class="t">总卡片数</div></div>
            <div class="stat"><div class="n" id="count-shown">—</div><div class="t">当前显示</div></div>
          </div>
        </div>
      </div>

      <div class="subhead">
        <div class="left">
          <div class="kicker">ARCHIVE / INDEX</div>
          <div class="title">信息卡索引列表</div>
          <div class="note">标题 · 日期 · 标签 · 一句话摘要</div>
        </div>
      </div>

      <div class="controls">
        <div class="search-row">
          <input id="search-input" type="search" placeholder="搜索标题 / 标签…" autocomplete="off">
        </div>
        <div class="tag-toolbar">
          <div class="current-filter" id="current-filter"></div>
          <button class="tag-toggle" id="tag-toggle" type="button">展开全部</button>
        </div>
        <div class="tag-row">
          <div class="tag-viewport" id="tag-viewport">
            <div class="tag-filter" id="tag-filter"></div>
          </div>
        </div>
      </div>

      <div class="count-line" id="count-line">加载索引中…</div>
      <div class="cards" id="cards-list"></div>
      <div class="empty" id="empty-state" style="display:none;">无匹配结果</div>

  <div class="footer">
    <span>infocard-pub · ccwq.github.io · <span id="ver">加载中…</span></span>
    <span>客户端筛选 · 居中</span>
  </div>
</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script>
(async () => {
  // Register SW
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: '/infocard-pub/' }).catch(() => {});
  }

  // Load version
  const verEl = document.getElementById('ver');
  if (verEl) {
    const versionUrl = `./docs/version.json?t=${Date.now()}`;
    fetch(versionUrl, { cache: 'no-store' })
      .then(r => r.json())
      .then(d => { verEl.textContent = d.version; })
      .catch(() => { verEl.textContent = 'v?'; });
  }

  const cardsList = document.getElementById('cards-list');
  const searchInput = document.getElementById('search-input');
  const tagFilter = document.getElementById('tag-filter');
  const countLine = document.getElementById('count-line');
  const countTotal = document.getElementById('count-total');
  const countShown = document.getElementById('count-shown');

  let allCards = [];
  let activeTag = '';
  let tagsExpanded = false;
  const MAX_COLLAPSED_ROWS = 2;
  const tagFilterEl = document.getElementById('tag-filter');
  const tagViewport = document.getElementById('tag-viewport');
  const tagToggle = document.getElementById('tag-toggle');
  const currentFilterEl = document.getElementById('current-filter');

  // Load index
  try {
    // Cache-bust the manifest fetch so browsers don't keep rendering stale card counts.
    const resp = await fetch(`./_index.yaml?t=${Date.now()}`, { cache: 'no-store' });
    const text = await resp.text();
    const index = jsyaml.load(text);
    allCards = index.cards || [];
  } catch (e) {
    countLine.textContent = '索引加载失败，请稍后刷新';
    countTotal.textContent = '—';
    countShown.textContent = '—';
    cardsList.innerHTML = `<div class="empty">加载索引失败，请稍后刷新</div>`;
    return;
  }

  // All tags
  const tagSet = new Set();
  allCards.forEach(c => (c.tags || []).forEach(t => tagSet.add(t)));
  const tags = [...tagSet].sort();

  function setTagCollapseState(forceExpand) {
    const buttons = Array.from(tagFilter.querySelectorAll('button'));
    if (!buttons.length) return;

    const rows = [];
    let currentTop = null;
    buttons.forEach(btn => {
      const top = btn.offsetTop;
      if (currentTop === null || top !== currentTop) {
        rows.push(top);
        currentTop = top;
      }
    });

    const activeBtn = tagFilter.querySelector('button.active');
    const shouldExpand = forceExpand || tagsExpanded || (activeBtn && rows.indexOf(activeBtn.offsetTop) >= MAX_COLLAPSED_ROWS);

    if (shouldExpand || rows.length <= MAX_COLLAPSED_ROWS) {
      tagViewport.style.maxHeight = tagFilter.scrollHeight + 'px';
      tagToggle.textContent = '收起标签';
      tagToggle.classList.add('active');
      return;
    }

    const baseTop = rows[0] || 0;
    const visibleRows = rows.slice(0, MAX_COLLAPSED_ROWS);
    let lastBottom = 0;
    buttons.forEach(btn => {
      if (visibleRows.includes(btn.offsetTop)) {
        lastBottom = Math.max(lastBottom, btn.offsetTop + btn.offsetHeight);
      }
    });
    tagViewport.style.maxHeight = Math.max(0, (lastBottom - baseTop + 6)) + 'px';
    tagToggle.textContent = '展开全部';
    tagToggle.classList.remove('active');
  }

  function updateCurrentFilter() {
    if (!activeTag) {
      currentFilterEl.innerHTML = '当前筛选：<span style="color:#111;font-weight:700;">全部</span>';
      return;
    }
    currentFilterEl.innerHTML = `当前筛选：<span class="pill">${activeTag}<button id="clear-active-tag" type="button" aria-label="清除筛选">×</button></span>`;
    const clearBtn = document.getElementById('clear-active-tag');
    clearBtn && (clearBtn.onclick = () => {
      activeTag = '';
      renderTagFilter();
      renderCards();
    });
  }

  function renderTagFilter() {
    tagFilter.innerHTML = '';
    ['全部'].concat(tags).forEach(tag => {
      const btn = document.createElement('button');
      btn.textContent = tag;
      if ((tag === '全部' && !activeTag) || tag === activeTag) btn.classList.add('active');
      btn.onclick = () => {
        activeTag = tag === '全部' ? '' : tag;
        tagsExpanded = false;
        renderTagFilter();
        renderCards();
      };
      tagFilter.appendChild(btn);
    });
    updateCurrentFilter();
    setTagCollapseState(false);
  }

  function renderCards() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = allCards.filter(c => {
      const matchTag = !activeTag || (c.tags || []).includes(activeTag);
      const matchSearch = !q ||
        (c.title || '').toLowerCase().includes(q) ||
        (c.tags || []).some(t => t.toLowerCase().includes(q)) ||
        (c.category || '').toLowerCase().includes(q);
      return matchTag && matchSearch;
    });

    const total = allCards.length;
    const shown = filtered.length;
    countTotal.textContent = String(total);
    countShown.textContent = String(shown);
    countLine.textContent = `共 ${total} 张信息卡 · 显示 ${shown} 张`;

    if (!filtered.length) {
      cardsList.innerHTML = '';
      document.getElementById('empty-state').style.display = 'block';
      return;
    }

    document.getElementById('empty-state').style.display = 'none';
    cardsList.innerHTML = filtered.map(c => {
      const displayDate = (c.date || '').replace(/^"|"$/g, '').split('-').slice(1).join('/');
      const displayTitle = c.title || c.slug;
      const displayCat = (c.category || 'misc').toUpperCase();
      const displayTags = (c.tags || []).map(t => `<span class="tags"><span>${t}</span></span>`).join('');
      const href = (c.path || (c.slug || '') + '.html');
      const desc = c.desc || '';
      return `
      <div class="card-row">
        <div class="card-date">${displayDate}</div>
        <div class="card-body">
          <h2><a href="${href}">${displayTitle}</a></h2>
          <div class="meta">
            <span class="cat">${displayCat}</span>
            ${displayTags}
          </div>
          ${desc ? `<div class="desc">${desc}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  searchInput.addEventListener('input', renderCards);
  tagToggle.addEventListener('click', () => {
    tagsExpanded = !tagsExpanded;
    setTagCollapseState(tagsExpanded);
    tagToggle.textContent = tagsExpanded ? '收起标签' : '展开全部';
    tagToggle.classList.toggle('active', tagsExpanded);
  });
  window.addEventListener('resize', () => requestAnimationFrame(() => setTagCollapseState(tagsExpanded)));
  renderTagFilter();
  renderCards();
})();
</script>
