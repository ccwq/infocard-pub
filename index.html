        </div>

        <span>infocard-pub · ccwq.github.io · <span id="ver">加载中…</span></span>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script>
(async () => {
  const verEl = document.getElementById('ver');
  if (verEl) {
    const versionUrl = `./docs/version.json?t=${Date.now()}`;
    fetch(versionUrl, { cache: 'no-store' })
      .then(r => r.json())
      .then(d => { verEl.textContent = d.version; })
      .catch(() => { verEl.textContent = 'v?'; });
  }

  const cardsList = document.getElementById('cards-list');
  const searchInput = document.getElementById('search-input');
  const tagFilter = document.getElementById('tag-filter');
  const countLine = document.getElementById('count-line');
  const countTotal = document.getElementById('count-total');
  const countShown = document.getElementById('count-shown');
  const emptyState = document.getElementById('empty-state');
  const tagViewport = document.getElementById('tag-viewport');
  const tagToggle = document.getElementById('tag-toggle');
  const currentFilterEl = document.getElementById('current-filter');

  let allCards = [];
  let activeTag = '';
  let tagsExpanded = false;
  const MAX_COLLAPSED_ROWS = 1;

  const escapeHtml = (value) => String(value ?? '').replace(/[&<>\"']/g, (ch) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));

  const renderTags = (tags = []) => tags.map(tag => `<span class="tag-chip">${escapeHtml(tag)}</span>`).join('');
  const pad2 = (n) => String(n).padStart(2, '0');

  const parseLooseDate = (value) => {
    if (!value) return null;
    const raw = String(value).trim().replace(/^\"|\"$/g, '');
    if (!raw) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return new Date(`${raw}T12:00:00`);
    const d = new Date(raw.replace(' ', 'T'));
    return Number.isNaN(d.getTime()) ? null : d;
  };

  const formatDate = (value) => {
    const d = parseLooseDate(value);
    if (!d) return '—';
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  };

  const formatClock = (value) => {
    const d = parseLooseDate(value);
    if (!d) return '—';
    return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  };

  const formatDateTime = (value) => {
    const d = parseLooseDate(value);
    if (!d) return '—';
    return `${formatDate(d)} ${formatClock(d)}`;
  };

  const pickFirstDate = (...values) => {
    for (const v of values) {
      const d = parseLooseDate(v);
      if (d) return d;
    }
    return null;
  };

  const buildTimeMeta = (card) => {
    const submitted = pickFirstDate(card._created_at, card.created_at, card.date, card.created, card._submitted_at);
    const modified = pickFirstDate(card._modified_at, card.modified_at, card._modified_date, card.updated_at, card.updated, card.date, card._created_at, card.created_at);
    const effective = modified || submitted;
    const label = modified && submitted && modified.getTime() > submitted.getTime() ? '修改' : '提交';
    return {
      label,
      date: formatDate(effective),
      clock: formatClock(effective),
      full: formatDateTime(effective),
      ts: effective ? effective.getTime() : 0
    };
  };

  try {
    const resp = await fetch(`./_index.yaml?t=${Date.now()}`, { cache: 'no-store' });
    const text = await resp.text();
    const index = jsyaml.load(text);
    const indexedCards = Array.isArray(index.cards) ? index.cards : [];
    allCards = indexedCards.map((card, order) => ({ ...card, __order: order, __time: buildTimeMeta(card) }))
      .sort((a, b) => {
        if ((b.__time?.ts || 0) !== (a.__time?.ts || 0)) return (b.__time?.ts || 0) - (a.__time?.ts || 0);
        return String(a.title || a.slug || '').localeCompare(String(b.title || b.slug || ''), 'zh-Hans-CN');
      });
  } catch (e) {
    countLine.textContent = '索引加载失败，请稍后刷新';
    countTotal.textContent = '—';
    countShown.textContent = '—';
    cardsList.innerHTML = '<div class="empty" style="display:block;">加载索引失败，请稍后刷新</div>';
    return;
  }

  const tagCounter = new Map();
  allCards.forEach(c => (c.tags || []).forEach(t => tagCounter.set(t, (tagCounter.get(t) || 0) + 1)));
  const tags = [...tagCounter.entries()]
    .sort((a, b) => (b[1] - a[1]) || String(a[0]).localeCompare(String(b[0]), 'zh-Hans-CN'))
    .map(([tag]) => tag);

  function setTagCollapseState(forceExpand = false) {
    const buttons = Array.from(tagFilter.querySelectorAll('button'));
    if (!buttons.length) return;
    const rows = [];
    let currentTop = null;
    buttons.forEach(btn => {
      const top = btn.offsetTop;
      if (currentTop === null || top !== currentTop) {
        rows.push(top);
        currentTop = top;
      }
    });
    const activeBtn = tagFilter.querySelector('button.active');
    const shouldExpand = forceExpand || tagsExpanded || (activeBtn && rows.indexOf(activeBtn.offsetTop) >= MAX_COLLAPSED_ROWS);
    if (shouldExpand || rows.length <= MAX_COLLAPSED_ROWS) {
      tagViewport.style.maxHeight = `${tagFilter.scrollHeight}px`;
      tagToggle.textContent = '收起标签';
      tagToggle.classList.add('active');
      return;
    }
    const baseTop = rows[0] || 0;
    const visibleRows = rows.slice(0, MAX_COLLAPSED_ROWS);
    let lastBottom = 0;
    buttons.forEach(btn => {
      if (visibleRows.includes(btn.offsetTop)) {
        lastBottom = Math.max(lastBottom, btn.offsetTop + btn.offsetHeight);
      }
    });
    tagViewport.style.maxHeight = `${Math.max(0, (lastBottom - baseTop + 6))}px`;
    tagToggle.textContent = '更多标签';
    tagToggle.classList.remove('active');
  }

  function updateCurrentFilter() {
    if (!activeTag) {
      currentFilterEl.innerHTML = '筛选：<span class="all">全部</span> · 默认只展开热门标签';
      return;
    }
    currentFilterEl.innerHTML = `筛选：<span class="pill">${escapeHtml(activeTag)}<button id="clear-active-tag" type="button" aria-label="清除筛选">×</button></span>`;
    const clearBtn = document.getElementById('clear-active-tag');
    if (clearBtn) {
      clearBtn.onclick = () => {
        activeTag = '';
        renderTagFilter();
        renderCards();
      };
    }
  }

  function renderTagFilter() {
    tagFilter.innerHTML = '';
    ['全部', ...tags].forEach(tag => {
      const btn = document.createElement('button');
      btn.textContent = tag;
      if ((tag === '全部' && !activeTag) || tag === activeTag) btn.classList.add('active');
      btn.onclick = () => {
        activeTag = tag === '全部' ? '' : tag;
        tagsExpanded = false;
        renderTagFilter();
        renderCards();
      };
      tagFilter.appendChild(btn);
    });
    updateCurrentFilter();
    setTagCollapseState(false);
  }

  function renderCards() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = allCards.filter(c => {
      const matchTag = !activeTag || (c.tags || []).includes(activeTag);
      const matchSearch = !q ||
        String(c.title || '').toLowerCase().includes(q) ||
        String(c.slug || '').toLowerCase().includes(q) ||
        (c.tags || []).some(t => String(t).toLowerCase().includes(q)) ||
        String(c.category || '').toLowerCase().includes(q);
      return matchTag && matchSearch;
    });

    const total = allCards.length;
    const shown = filtered.length;
    countTotal.textContent = String(total);
    countShown.textContent = String(shown);
    countLine.textContent = `共 ${total} 张信息卡 · 显示 ${shown} 张 · 按修改时间倒序`;

    if (!filtered.length) {
      cardsList.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }

    emptyState.style.display = 'none';
    cardsList.innerHTML = filtered.map(c => {
      const time = c.__time || buildTimeMeta(c);
      const displayTitle = escapeHtml(c.title || c.slug || '未命名');
      const displayCat = escapeHtml((c.category || 'misc').toUpperCase());
      const displayTags = renderTags(c.tags || []);
      const href = escapeHtml(c.path || `${c.slug || ''}.html`);
      const desc = escapeHtml(c.desc || c.note || '');
      const dateLabel = escapeHtml(time.label);
      return `
        <div class="card-row">
          <div class="card-date">
            <div class="date-block is-primary">
              <span class="date-label">${dateLabel}</span>
              <span class="date-value">${time.date}</span>
              <span class="date-clock">${time.clock}</span>
            </div>
            <div class="date-block">
              <span class="date-label">时间</span>
              <span class="date-value">${time.full}</span>
            </div>
          </div>
          <div class="card-body">
            <h2><a href="${href}">${displayTitle}</a></h2>
            <div class="meta">
              <span class="cat">${displayCat}</span>
              ${displayTags}
            </div>
            ${desc ? `<div class="desc">${desc}</div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  searchInput.addEventListener('input', renderCards);
  tagToggle.addEventListener('click', () => {
    tagsExpanded = !tagsExpanded;
    setTagCollapseState(tagsExpanded);
    tagToggle.textContent = tagsExpanded ? '收起' : '展开';
    tagToggle.classList.toggle('active', tagsExpanded);
  });
  window.addEventListener('resize', () => requestAnimationFrame(() => setTagCollapseState(tagsExpanded)));

  renderTagFilter();
  renderCards();
})();
</script>
</body>
</html>
