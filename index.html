<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>infocard-pub</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #f6f6f3;
      color: #111;
      line-height: 1.5;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    .hero {
      padding: 28px;
      border: 1px solid #111;
      background: #fff;
      box-shadow: 8px 8px 0 #111;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 40px;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }
    p { margin: 0 0 12px; font-size: 16px; }
    code {
      padding: 0 6px;
      border: 1px solid #ddd;
      background: #fafafa;
      border-radius: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }
    .card {
      padding: 18px;
      border: 1px solid #111;
      background: #fff;
    }
    .card h2 { margin: 0 0 8px; font-size: 18px; }
    .muted { color: #555; }
    ul { margin: 10px 0 0 18px; padding: 0; }
    a { color: #111; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>infocard-pub</h1>
      <p>公开信息卡托管仓库。信息卡由本地生成后统一提交到这里，通过 GitHub Pages 提供稳定公开链接。</p>
      <p>路径规范：<code>/{category}/{YYYYMMDD}-{keywords}.html</code></p>
    </section>

    <section class="grid">
      <article class="card">
        <h2>发布方式</h2>
        <p class="muted">推送到 <code>main</code> 后，由 GitHub Actions 自动部署到 Pages。</p>
      </article>
      <article class="card">
        <h2>内容组织</h2>
        <p class="muted">按分类目录存放，方便后续检索和统一管理。</p>
      </article>
      <article class="card">
        <h2>命名规则</h2>
        <p class="muted">日期 + 语义关键词，兼顾唯一性和可读性。</p>
      </article>
    </section>
  </main>
</body>
</html>
