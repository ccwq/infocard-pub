name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify committed generated artifacts
        run: npm run verify

      - name: Verify taxonomy completeness
        run: npm run verify-taxonomy

      - name: Ensure build does not mutate tracked files
        run: git diff --exit-code

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed index
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const pageUrl = process.env.PAGE_URL.replace(/\/$/, '');
          const indexUrl = `${pageUrl}/_index.yaml`;
          const expected = fs.readFileSync('_index.yaml', 'utf8');
          const local = require('./scripts/index-build-lib').extractInjectedIndexData(fs.readFileSync('index.html', 'utf8'));
          const localTop = Array.isArray(local.cards) && local.cards.length ? local.cards[0].slug : null;

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            let lastErr = '';
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              try {
                const response = await fetch(indexUrl, { cache: 'no-store' });
                const remoteText = await response.text();
                const remote = require('./assets/home/vendor/js-yaml.min.js').load(remoteText);
                const remoteTop = Array.isArray(remote.cards) && remote.cards.length ? remote.cards[0].slug : null;
                if (remoteText === expected && remoteTop === localTop) {
                  console.log(`Smoke test OK on attempt ${attempt}: top=${remoteTop}`);
                  process.exit(0);
                }
                lastErr = `mismatch attempt ${attempt}: local_top=${localTop}, remote_top=${remoteTop}`;
              } catch (error) {
                lastErr = `attempt ${attempt} failed: ${error.message}`;
              }
              console.log(lastErr);
              await sleep(15000);
            }
            throw new Error(`Deployed index smoke test failed: ${lastErr}`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
