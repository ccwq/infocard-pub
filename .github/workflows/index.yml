name: Build Infocard Index

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Build _index.yaml
        run: python scripts/rebuild_index.py

      - name: Verify _index.yaml
        run: python scripts/verify_index.py

      - name: Upload _index.yaml as artifact
        uses: actions/upload-artifact@v4
        with:
          name: infocard-index
          path: _index.yaml
          retention-days: 1

      - name: Commit _index.yaml to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _index.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: sync _index.yaml [skip ci]"
          git push