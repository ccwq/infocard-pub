name: Build Infocard Index

on:
  push:
    branches:
      - main
    paths:
      - '**/*.meta.yaml'
      - '_index.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build _index.yaml
        run: |
          python3 << 'PY'
          import glob
          import os
          import subprocess
          import yaml
          from datetime import datetime, timezone

          def git_commit_ts(path: str) -> int:
              try:
                  out = subprocess.check_output(
                      ['git', 'log', '-1', '--format=%ct', '--', path],
                      text=True,
                  ).strip()
                  return int(out) if out else 0
              except Exception:
                  return 0

          entries = []
          for f in sorted(glob.glob('**/*.meta.yaml', recursive=True)):
              if '.git' in f:
                  continue
              with open(f) as fp:
                  data = yaml.safe_load(fp)
              data['_sort_ts'] = git_commit_ts(f)
              entries.append(data)

          index = {
              '_count': len(entries),
              '_updated': datetime.now(timezone.utc).isoformat(),
              'cards': sorted(entries, key=lambda x: (x.get('_sort_ts', 0), x.get('date', '')), reverse=True)
          }

          with open('_index.yaml', 'w') as fp:
              yaml.safe_dump(index, fp, allow_unicode=True, sort_keys=False)

          print(f'Index written: {len(entries)} cards')
          PY

      - name: Upload _index.yaml as artifact
        uses: actions/upload-artifact@v4
        with:
          name: infocard-index
          path: _index.yaml
          retention-days: 1

      - name: Commit _index.yaml to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _index.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: sync _index.yaml [skip ci]"
          git push