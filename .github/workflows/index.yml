name: Verify Generated Index Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build site artifact
        run: npm run build

      - name: Verify generated artifact
        run: npm run verify

      - name: Verify taxonomy completeness
        run: npm run verify-taxonomy
