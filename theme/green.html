<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>infocard-green-style 元素演示</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;overflow-x:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0fdf4;color:#111;font-size:13px}
    .page{width:100%;max-width:720px;margin:0 auto;padding:16px 14px 80px}
    /* === 绿色强调系 === */
    .kicker{border-left:4px solid #15803d;padding-left:10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#15803d;margin-bottom:10px}
    h2{font-size:18px;font-weight:700;margin:0 0 10px;color:#111;letter-spacing:-.02em}
    /* === 网格卡片 === */
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
    .cell{border:1.5px solid #15803d;border-radius:6px;background:#dcfce7;padding:10px 10px 8px;text-align:center}
    .cell strong{display:block;font-size:16px;font-weight:700;color:#14532d}
    .cell span{font-size:11px;color:#14532d;font-weight:600}
    /* === 列表行 === */
    .rows{border:1.5px solid #15803d;border-radius:6px;overflow:hidden;margin-bottom:12px}
    .row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #bbf7d0;font-size:12px}
    .row:last-child{border-bottom:none}
    .row .label{font-weight:700;color:#15803d}
    .row .val{color:#111;font-weight:600}
    .row.highlight{background:#dcfce7}
    /* === pill 标签 === */
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .chip{padding:3px 9px;border:1.5px solid #15803d;border-radius:20px;font-size:11px;font-weight:700;color:#15803d;background:#f0fdf4}
    .chip.fill{background:#15803d;color:#fff}
    /* === 按钮 === */
    .btn{display:inline-block;padding:7px 16px;border:2px solid #15803d;border-radius:6px;background:#15803d;color:#fff;font-size:12px;font-weight:700;text-decoration:none}
    .btn.outline{background:#f0fdf4;color:#15803d}
    /* === 备注 === */
    .note{border-left:4px solid #15803d;padding:10px 12px;background:#f0fdf4;border-radius:0 6px 6px 0;font-size:12px;line-height:1.65;color:#14532d}
    p{font-size:13px;line-height:1.7;color:#374151;margin:0 0 12px}
  </style>
</head>
<body>
  <div class="page">
    <div class="kicker">GREEN · TEAL · EDITORIAL</div>
    <h2>青绿 / 翡翠 / teal 系强调</h2>
    <p>绿色主题保留技术信息卡的秩序感与可读性，适合克制、清爽、专业感的知识卡与工具卡。</p>

    <div class="grid">
      <div class="cell"><strong>12</strong><span>工具数</span></div>
      <div class="cell"><strong>3.2k</strong><span>下载</span></div>
      <div class="cell"><strong>98%</strong><span>好评</span></div>
    </div>

    <div class="rows">
      <div class="row highlight"><span class="label">最新版本</span><span class="val">v2.4.1</span></div>
      <div class="row"><span class="label">许可证</span><span class="val">MIT</span></div>
      <div class="row"><span class="label">星标</span><span class="val">3.2k</span></div>
      <div class="row"><span class="label">最后更新</span><span class="val">3天前</span></div>
    </div>

    <div class="chips">
      <span class="chip fill">teal</span>
      <span class="chip">翡翠</span>
      <span class="chip fill">青绿</span>
      <span class="chip">克制</span>
    </div>

    <div>
      <a class="btn" href="#">安装</a>
      <a class="btn outline" href="#" style="margin-left:8px">文档</a>
    </div>

    <div class="note" style="margin-top:12px">
      适合：克制、专业、冷静的阅读型卡片。<br>
      不适合：高压结论感的黑头调查风。
    </div>
  </div>
<script>
(function(){
  function send(){var h=document.body.scrollHeight;window.parent.postMessage({type:'theme-height',slug:'green',height:h},'*');}if(document.readyState==='complete'){send()}else{window.addEventListener('load',send)}setTimeout(send,500);})();
</script>
</body>
</html>
