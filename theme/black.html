<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>infocard-black-head-style 元素演示</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;overflow-x:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:#111;font-size:13px}
    .page{width:100%;max-width:720px;margin:0 auto;padding:0 0 80px}
    /* === 黑色顶栏 === */
    header{background:#070707;color:#fff;padding:10px 14px;border-bottom:3px solid #c8102e}
    header .tag{display:inline-block;padding:2px 8px;border:1.5px solid #fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
    h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.1}
    /* === 引语块 === */
    .quote{border-left:4px solid #c8102e;padding:10px 14px;background:#fff5f6;margin:14px 14px 0;font-size:13px;line-height:1.7;font-weight:700;color:#c8102e}
    /* === 内容区 === */
    section{padding:14px 14px 0}
    h2{font-size:15px;font-weight:700;margin:0 0 8px;padding-bottom:6px;border-bottom:1.5px solid #070707}
    .points{display:grid;gap:6px;margin-bottom:12px}
    .point{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.65}
    .point .num{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;background:#070707;color:#fff;font-size:11px;font-weight:700;border-radius:50%;flex-shrink:0}
    .point .num.red{background:#c8102e}
    /* === 判断块 === */
    .verdict{background:#070707;color:#fff;padding:12px 14px;margin:0 14px 12px;border-radius:0}
    .verdict .label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#c8102e;margin-bottom:4px}
    .verdict p{font-size:13px;line-height:1.65;margin:0}
    /* === 标签 === */
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .chip{padding:3px 9px;border:1.5px solid #070707;font-size:11px;font-weight:700}
    .chip.red{border-color:#c8102e;color:#c8102e;background:#fff5f6}
    .chip.blue{border-color:#1b4fff;color:#1b4fff;background:#eef4ff}
    /* === 分隔线 === */
    hr{border:none;border-top:1.5px solid #070707;margin:12px 14px}
    /* === 按钮 === */
    .btn{display:inline-block;padding:7px 14px;border:2px solid #070707;background:#070707;color:#fff;font-size:12px;font-weight:700;text-decoration:none}
    .btn.red{background:#c8102e;border-color:#c8102e}
    /* === 步骤 === */
    .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
    .step{border:1.5px solid #070707;padding:8px 8px 6px;text-align:center;font-size:11px;font-weight:700}
    .step strong{display:block;font-size:16px;margin-bottom:2px}
    .step.done{background:#f0fdf4;border-color:#15803d}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="tag">调查档案 · 2026-06-04</div>
      <h1>黑头主题元素演示</h1>
    </header>
    <div class="quote">黑色页眉是视觉锚点，白纸正文承载大块说明，红色负责结论与风险。</div>
    <section>
      <h2>已确认事实</h2>
      <div class="points">
        <div class="point"><span class="num">1</span><span>黑色顶栏 + 红色结论先行，构成高压视觉节奏。</span></div>
        <div class="point"><span class="num red">2</span><span>红色用于风险标记、引语高亮、判断区。</span></div>
        <div class="point"><span class="num">3</span><span>蓝绿辅助：蓝=流程，绿=确认，绿=数据支撑。</span></div>
      </div>
      <div class="chips">
        <span class="chip red">结论先行</span>
        <span class="chip">黑头</span>
        <span class="chip blue">调查拆解</span>
        <span class="chip">流程</span>
      </div>
      <div class="steps">
        <div class="step done"><strong>①</strong>锁定</div>
        <div class="step done"><strong>②</strong>调查</div>
        <div class="step"><strong>③</strong>判断</div>
        <div class="step"><strong>④</strong>归档</div>
      </div>
    </section>
    <hr>
    <div style="padding:0 14px 14px">
      <div class="verdict">
        <div class="label">关键判断</div>
        <p>适合调查、论证、workflow 拆解与“先结论再展开”的结构。不适合贴纸感 Q 风或大面积色块海报。</p>
      </div>
      <div style="margin-top:10px">
        <a class="btn red" href="#">查看调查</a>
        <a class="btn" href="#" style="margin-left:8px">返回列表</a>
      </div>
    </div>
  </div>
</body>
</html>
