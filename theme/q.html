<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>infocard-q-style 元素演示</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;overflow-x:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8efd9;color:#1d1b16;font-size:13px}
    /* === 暖米纸背景 === */
    .page{width:100%;max-width:720px;margin:0 auto;padding:16px 14px 80px}
    /* === 厚黑边框圆角卡片 === */
    .card{border:3px solid #111;border-radius:12px;padding:14px 14px 12px;background:#fffdf9;margin-bottom:10px;box-shadow:5px 5px 0 rgba(16,16,16,.13)}
    .card-title{font-size:18px;font-weight:700;margin:0 0 8px;letter-spacing:-.02em}
    .card-body{font-size:13px;line-height:1.65;color:#3d3a32}
    /* === 彩色 accent chips === */
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .chip{padding:4px 10px;border:2px solid #111;border-radius:20px;font-size:11px;font-weight:700;background:#9bdc77}
    .chip.blue{background:#7cc8ff}
    .chip.yellow{background:#ffc45c}
    .chip.pink{background:#ffb3c6}
    .chip.gray{background:#e0d9cc;color:#555}
    /* === 彩色标签 === */
    .tag{padding:3px 8px;border:2px solid #111;border-radius:6px;font-size:10px;font-weight:700;background:#ffe36e}
    /* === 网格布局 === */
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
    .grid-cell{border:2px solid #111;border-radius:8px;background:#fff;padding:8px 8px 6px;font-size:11px;font-weight:700;text-align:center}
    .grid-cell strong{display:block;font-size:15px}
    /* === 按钮 === */
    .btn{display:inline-block;padding:7px 14px;border:2px solid #111;border-radius:8px;background:#1d1b16;color:#fff;font-size:12px;font-weight:700;text-decoration:none}
    .btn.alt{background:#ffe36e;color:#111;border-radius:20px}
    /* === emoji 装饰 === */
    .emoji{font-size:22px;margin-right:6px;vertical-align:middle}
    .note{border:2px solid #111;border-radius:8px;padding:10px 12px;background:#fff;font-size:12px;line-height:1.6}
    .note strong{color:#c8102e}
    h2{font-size:14px;font-weight:700;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:#625d56}
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="chips">
        <span class="chip">纸感</span>
        <span class="chip blue">手作</span>
        <span class="chip yellow">并列对比</span>
        <span class="chip pink">彩色 accent</span>
        <span class="tag">贴纸式</span>
        <span class="chip gray">圆角</span>
      </div>
      <h2 class="card-title"><span class="emoji">📋</span>Q 版主题元素演示</h2>
      <p class="card-body">暖米纸背景、厚黑边框、圆角卡片、彩色 pill 与贴纸式标签，适合框架对比、方法论总览与轻编辑风知识卡。</p>
    </div>

    <div class="grid">
      <div class="grid-cell"><strong>12</strong>工具卡</div>
      <div class="grid-cell"><strong>3</strong>层级</div>
      <div class="grid-cell"><strong>8</strong>标签</div>
    </div>

    <div class="card">
      <h2 class="card-title"><span class="emoji">🧩</span>Stats Grid · 三列布局</h2>
      <p class="card-body">看板式、拼贴感、贴纸层级。高密度网格与彩色标签构成视觉节奏。</p>
    </div>

    <div class="card">
      <div class="chips">
        <span class="chip blue">安装</span>
        <span class="chip yellow">使用</span>
        <span class="chip pink">边界</span>
      </div>
      <p class="card-body">适合“多选项并列 + 轻编辑 + 贴纸式层级”。不要拿它去承载严肃调查卡或黑头结论页。</p>
      <div style="margin-top:10px">
        <a class="btn" href="#">主要按钮</a>
        <a class="btn alt" href="#" style="margin-left:8px">次要按钮</a>
      </div>
    </div>

    <div class="note">
      <strong>不适合：</strong>严肃调查风、高压结论感、大段文字说明书、黑色顶栏结构。
    </div>
  </div>
<script>
(function(){
  function send(){var h=document.body.scrollHeight;window.parent.postMessage({type:'theme-height',slug:'q',height:h},'*');}if(document.readyState==='complete'){send()}else{window.addEventListener('load',send)}setTimeout(send,500);})();
</script>
</body>
</html>
