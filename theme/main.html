<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>infocard-main-style 元素演示</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;overflow-x:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f2ec;color:#111;font-size:12px}
    .page{width:100%;max-width:720px;margin:0 auto;padding:14px 12px 80px}
    /* === 顶栏 === */
    header{border-bottom:2px solid #0a0a0a;padding-bottom:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-end}
    .badge{display:inline-block;padding:2px 8px;border:1.5px solid #0a0a0a;background:#0a0a0a;color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
    h1{font-size:16px;font-weight:700;margin:4px 0 0;letter-spacing:-.02em}
    .meta{font-size:10px;color:#777}
    /* === stats 条 === */
    .stats{display:flex;flex-wrap:wrap;border:1.5px solid #0a0a0a;margin-bottom:10px;overflow:hidden}
    .stat{flex:1;min-width:60px;padding:8px 10px 6px;border-right:1.5px solid #0a0a0a;text-align:center}
    .stat:last-child{border-right:none}
    .stat strong{display:block;font-size:15px;font-weight:700;line-height:1}
    .stat span{font-size:10px;color:#555;font-weight:600}
    /* === pill 行 === */
    .pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
    .pill{padding:3px 8px;border:1.5px solid #0a0a0a;font-size:10px;font-weight:700;background:#fff}
    .pill.blue{background:#eef4ff;border-color:#0036a3;color:#0036a3}
    .pill.yellow{background:#fff1b0;border-color:#e8c200;color:#6b4e00}
    .pill.green{background:#dcfce7;border-color:#15803d;color:#14532d}
    /* === section === */
    .section{border:1.5px solid #0a0a0a;margin-bottom:8px;overflow:hidden}
    .sec-head{background:#0a0a0a;color:#fff;padding:6px 10px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
    .sec-head .num{color:#c8102e}
    .sec-body{padding:8px 10px;background:#fffdf9}
    h3{font-size:13px;font-weight:700;margin:0 0 6px}
    p{font-size:12px;line-height:1.65;margin:0 0 8px;color:#333}
    /* === 列表 === */
    ul{margin:0;padding:0 0 0 16px;font-size:12px;line-height:1.8}
    /* === 标签 === */
    .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
    .tag{padding:2px 7px;border:1.5px solid #c8102e;color:#c8102e;font-size:10px;font-weight:700;background:#fff5f6}
    /* === 按钮 === */
    .btn{display:inline-block;padding:6px 12px;border:2px solid #0a0a0a;background:#0a0a0a;color:#fff;font-size:11px;font-weight:700;text-decoration:none}
    .btn.red{background:#c8102e;border-color:#c8102e}
    /* === 表格 === */
    table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
    th,td{padding:5px 8px;border:1.5px solid #0a0a0a;text-align:left}
    th{background:#0a0a0a;color:#fff;font-weight:700}
    tr:nth-child(even) td{background:#fffdf9}
    /* === flow === */
    .flow{display:flex;align-items:center;gap:0;margin-bottom:10px;font-size:11px}
    .flow-item{flex:1;border:1.5px solid #0a0a0a;padding:6px 8px;text-align:center;font-weight:700;background:#fffdf9}
    .flow-arrow{width:20px;text-align:center;font-size:13px;color:#c8102e;font-weight:700;flex-shrink:0}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <div class="badge">OPEN SOURCE · TOOL</div>
        <h1>主骨架主题元素演示</h1>
        <div class="meta">默认主骨架 · 红黑白 · 高密度模块化</div>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><strong>13k</strong><span>Stars</span></div>
      <div class="stat"><strong>2k</strong><span>Forks</span></div>
      <div class="stat"><strong>100%</strong><span>离线</span></div>
      <div class="stat"><strong>8</strong><span>语言</span></div>
    </div>

    <div class="pills">
      <span class="pill blue">蓝辅助</span>
      <span class="pill yellow">状态色</span>
      <span class="pill green">绿确认</span>
      <span class="pill">stats</span>
      <span class="pill">grid</span>
      <span class="pill">pill</span>
      <span class="pill">flow</span>
    </div>

    <div class="section">
      <div class="sec-head"><span class="num">01</span><span>核心特征</span></div>
      <div class="sec-body">
        <h3>它是什么</h3>
        <p>红黑白主骨架，蓝黄绿辅助状态色，stats / grid / pill / flow / section 齐全。</p>
        <div class="tags">
          <span class="tag">高密度</span>
          <span class="tag">模块化</span>
          <span class="tag">说明书感</span>
        </div>
      </div>
    </div>

    <table>
      <tr><th>特征</th><th>值</th><th>说明</th></tr>
      <tr><td>星标</td><td>13k+</td><td>活跃开源</td></tr>
      <tr><td>许可证</td><td>MIT</td><td>免费商用</td></tr>
      <tr><td>最新版本</td><td>v1.2</td><td>2026-05</td></tr>
    </table>

    <div class="flow">
      <div class="flow-item">安装</div>
      <div class="flow-arrow">→</div>
      <div class="flow-item">配置</div>
      <div class="flow-arrow">→</div>
      <div class="flow-item">运行</div>
      <div class="flow-arrow">→</div>
      <div class="flow-item">验证</div>
    </div>

    <div>
      <a class="btn red" href="#">查看详情</a>
      <a class="btn" href="#" style="margin-left:8px">文档</a>
    </div>
  </div>
</body>
</html>
