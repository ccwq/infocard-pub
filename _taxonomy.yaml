version: 1

strategy:
  homepage_primary_dimensions:
    - topics
    - tech_stack
    - tool_types
    - stages
    - interaction
    - content_type
  homepage_advanced_dimensions:
    - source
    - style
    - risk
  legacy_tags_policy: search_only
  category_policy: keep_for_back_compat_but_not_primary_filter
  matching:
    intra_dimension: or
    inter_dimension: and

dimensions:
  tech_stack:
    name: "技术栈 / 平台"
    description: "语言、运行环境与目标平台；不承载内容主题。"
    tags:
      - Android
      - JavaScript
      - TypeScript
      - Node.js
      - Python
      - Rust
      - Go
      - Kotlin
      - Windows
      - macOS
      - Linux

  topics:
    name: "主题领域"
    description: "卡片讨论的技术、行业或知识主题；与技术栈分离。"
    tags:
      - AI / LLM
      - Agent / 自动化
      - Web 前端
      - DevOps
      - CLI / Terminal
      - 操作系统
      - 游戏开发
      - Obsidian
      - 知识管理
      - 安全 / 红队
      - 数据 / 分析
      - 设计 / 动效
      - 多媒体 / 视频
      - 金融 / 投研
      - 教育 / 科普
      - 舆情 / 调查
      - 网络 / 基础设施
      - 数据库
      - 3D / 图形
      - GIS / 地图

  tool_types:
    name: "工具类型"
    description: "最核心的过滤维度。"
    tags:
      - CLI 工具
      - IDE / 编辑器
      - 构建工具
      - 包管理器
      - 进程管理
      - 版本控制
      - 调试工具
      - 自动化工具
      - 网络工具
      - 图形 / 可视化
      - 动画引擎
      - 地理引擎
      - AI 辅助工具
      - Agent 框架
      - MCP / 协议
      - 脚本工具
      - 多仓库管理
      - 知识库工具
      - 浏览器自动化
      - 设计工具
      - 数据处理工具
      - 监控 / 可观测
      - 安全工具
      - 内容生成工具
      - AI API 网关
      - PDF 处理工具
      - 数据提取工具
      - OCR 工具
      - 开发辅助工具

  stages:
    name: "使用阶段"
    description: "适合做“我现在在干什么”的快速定位。"
    tags:
      - 需求 / 规划
      - 开发
      - 构建
      - 调试
      - 测试
      - 发布
      - 运维
      - 监控
      - 重构
      - 性能优化
      - 学习 / 入门
      - 规范 / 流程
      - 调研 / 选型
      - 知识沉淀
      - 风险评估

  interaction:
    name: "交互形态"
    description: "区分 CLI / GUI / 自动化 / 插件等入口。"
    tags:
      - 命令行
      - GUI
      - Web API
      - 库 / SDK
      - 框架
      - 守护进程
      - 代理 / 服务
      - 插件
      - 浏览器扩展
      - MCP Server
      - 桌面应用
      - Web 应用
      - 移动端
      - 配置文件
      - 提示词 / Skill

  content_type:
    name: "内容类型"
    description: "infocard-pub 特有维度，用于区分卡片本身是什么。"
    tags:
      - 开源项目
      - 工具介绍
      - 技术手册
      - 方法论
      - 调查报告
      - 舆情核查
      - 人物 / 组织
      - 资源清单
      - 教程 / 入门
      - 对比评测
      - 安全风险
      - 产品分析
      - 科普解释
      - 观点文章
      - 命令参考
      - 技术说明
      - 方案拆解
      - 工作流图解
      - 价格调研

  source:
    name: "来源"
    description: "从普通 tags 中剥离，作为高级筛选。"
    tags:
      - GitHub
      - X / Twitter
      - Website
      - Blog
      - PDF
      - Paper
      - Wikipedia
      - Screenshot
      - User-provided
      - News
      - Video
      - Unknown / legacy

  style:
    name: "风格"
    description: "仅用于高级筛选，不作为普通 tags。"
    tags:
      - hardblue
      - redswiss
      - q-style
      - wood
      - black-head
      - graph-paper
      - pixelstack
      - archive-green
      - darkblue
      - darkgreen
      - scrapbook
      - white-purple
      - color-material
      - dang-ai-dark
      - bigwhite
      - blue-technical-manual
      - main-style
      - main
      - blue
      - black
      - handline
      - legacy / 未分类

  risk:
    name: "风险等级"
    description: "用于识别安全 / 合规 /政策敏感内容。"
    tags:
      - 低风险
      - 中风险
      - 安全敏感
      - 政策敏感
      - 高风险

aliases:
  claude-code: Claude Code
